/* Layout: photographer's gallery. Every photo gets a wide dark stage whose backdrop is the same photo, blurred, with the sharp print beside a large italic title. Between the stages the page is quiet: fine rules, small type, ingredients beside steps. */
:root{
  --bg:#E7E9E4;
  --ink:#151715;
  --soft:#4F554F;
  --line:#CBCFC8;
  --accent:#9A540A;
  --stage-ink:#FFFFFF;
  --stage-line:rgba(255,255,255,.5);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101210;--ink:#ECEEE8;--soft:#A3AAA2;--line:#2A2E2A;--accent:#E8A04A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101210;--ink:#ECEEE8;--soft:#A3AAA2;--line:#2A2E2A;--accent:#E8A04A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.page{max-width:1280px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:italic 600 1.5rem/1 var(--f-display);text-decoration:none}
.brand svg{width:32px;height:32px;flex:none;color:var(--accent)}

.navr{display:flex;align-items:center;gap:10px}
.navbtn{font:600 .9rem var(--f-body);padding:7px 16px;border:1px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);white-space:nowrap}
.navbtn:hover,.navbtn[aria-current="page"]{background:var(--ink);color:var(--bg)}
@media (max-width:520px){.brand{font-size:1rem;gap:5px;white-space:nowrap}.brand svg{width:20px;height:20px}.navbtn{padding:6px 9px;font-size:.78rem}.navr{gap:5px}.seg button{padding:6px 7px;min-width:30px;font-size:.78rem}.top{gap:8px}}
.soon{color:var(--soft);max-width:52ch;margin:18px 0 0}

.pintro{color:var(--soft);max-width:60ch;margin:0}
.rgbstage{position:relative;height:clamp(520px,86vh,960px);background:#000;overflow:hidden;isolation:isolate;border-radius:2px;margin-top:26px;user-select:none;-webkit-user-select:none}
.rgbstage:focus-visible{outline-offset:4px}
.lyr{position:absolute;display:block;max-width:none;mix-blend-mode:screen;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.lyr.grab{cursor:grabbing}
.lyr.off{display:none}
.rgbstage.anim .lyr{transition:left .4s ease,top .4s ease}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chip button{font:inherit;color:var(--ink);background:transparent;border:0;cursor:pointer}
.chip .sel{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;padding:8px 14px 8px 12px}
.chip .sel i{width:14px;height:14px;border-radius:50%;grid-row:1/3}
.chip .sel b{font-weight:600;line-height:1.2}
.chip .sel .off{font:500 .78rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--soft);white-space:pre}
.chip .sel[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .sel[aria-pressed="true"] .off{color:inherit;opacity:.8}
.chip .eye{padding:0 14px;border-left:1px solid var(--line);font-weight:600;font-size:.85rem;min-width:56px;color:var(--soft)}
.chip .eye[aria-pressed="true"]{color:var(--ink)}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:14px}
button.navbtn{background:transparent;cursor:pointer}
.snap{display:inline-flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.snap input{width:18px;height:18px;accent-color:var(--accent)}
.pstat{margin:16px 0 0;color:var(--soft);min-height:1.6em}
.pstat.ok{color:var(--accent);font-weight:600}
.phow{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);max-width:64ch}
.phow h2{font:italic 500 1.7rem/1.1 var(--f-display);margin:0 0 10px}
.phow p{color:var(--soft);margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:600 .9rem var(--f-body);padding:7px 14px;min-width:44px;border:0;background:transparent;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline-offset:-3px}

/* stage */
.stage{position:relative;overflow:hidden;isolation:isolate;border-radius:6px;background:#1A1A1A;color:var(--stage-ink);margin-top:28px}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.3);filter:blur(34px) brightness(.46) saturate(1.1);z-index:-1}
.stage .in{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:20px;align-items:center}
.stage .shot{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.cap{display:flex;flex-direction:column;gap:20px;min-width:0}
.cap h1,.cap h2,.cap .big{font:italic 500 clamp(2.6rem,7vw,5.4rem)/.98 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.stage a,.stage .link{color:inherit}
a.stage{display:block;text-decoration:none}
@media (min-width:760px){
  .stage .in{grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:72px;padding:52px 64px;min-height:640px}
  .stage.flip .in{grid-template-columns:minmax(0,1fr) minmax(0,430px)}
  .stage.flip .shot{order:2}
}
.stage .chips li{border-color:var(--stage-line);color:var(--stage-ink)}
.stage.wide .in{grid-template-columns:minmax(0,1fr);gap:28px;min-height:0}
.stage.wide .shot{aspect-ratio:1/1;object-position:50% 55%}
@media (min-width:760px){.stage.wide .shot{aspect-ratio:4/3}}
.open{align-self:flex-start;background:#FFFFFF;color:#151715;font-weight:600;padding:11px 24px;border-radius:999px}
a.stage:hover .open{filter:brightness(.92)}

.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{border:1px solid var(--line);color:var(--soft);padding:3px 12px;border-radius:999px;font-size:.88rem}

/* home */
.hero{padding:48px 0 0}
.hero h1{font:italic 500 clamp(3.6rem,15vw,10rem)/.92 var(--f-display);letter-spacing:-.03em;max-width:none;text-wrap:balance;padding-bottom:.2em}
.hero p{color:var(--soft);margin:16px 0 0;max-width:46ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0}
.pills button{font:500 .95rem var(--f-body);padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more{color:var(--soft);margin:44px 0 0}

/* recipe */
.back{display:inline-block;margin:22px 0 0;color:var(--soft);text-decoration:none;font-weight:600}
.back:hover{color:var(--ink)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin:36px 0 0;padding:18px 0;border-block:1px solid var(--line)}
.info div{display:flex;flex-direction:column}
.info dt{font-size:.85rem;color:var(--soft)}
.info dd{margin:0;font:italic 500 1.7rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:20px}
.tools .grp{display:flex;align-items:center;gap:10px}
.lbl{color:var(--soft);font-size:.92rem}
.cookbtn{font:600 .92rem var(--f-body);padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;margin-left:auto}
.cookbtn[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.hint{flex-basis:100%;margin:0;color:var(--soft);font-size:.92rem}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;margin-top:44px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start}}
.cols h2{font:italic 500 2.2rem/1.05 var(--f-display);margin-bottom:10px}
.cols section{min-width:0}
.ings{list-style:none;margin:0;padding:0}
.ings h3{font:italic 600 1.3rem/1.2 var(--f-display);color:var(--accent);margin:22px 0 4px}
.ings h3:first-child{margin-top:8px}
.ing{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ing input{flex:none;width:18px;height:18px;margin:.32em 0 0;accent-color:var(--accent)}
.amt{flex:none;min-width:4.4em;font-weight:600;font-variant-numeric:tabular-nums}
.nm{min-width:0}
.ing.is-done .amt,.ing.is-done .nm{color:var(--soft);text-decoration:line-through}
.glist{list-style:none;margin:0;padding:0}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;border-bottom:1px solid var(--line)}
.step{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:8px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:14px 0;cursor:pointer}
.step::before{content:counter(s);font:italic 500 2rem/1.1 var(--f-display);color:var(--accent)}
.step.is-done{color:var(--soft)}
.step.is-done span{text-decoration:line-through}
.cook .ing,.cook .step{font-size:1.2rem}
.cook .step{padding:18px 0}

.tips{list-style:none;margin:0;padding:0}
.tips li{padding:10px 0;border-bottom:1px solid var(--line);color:var(--soft)}
.tipsec{margin-top:40px}
.credit{margin:28px 0 0;color:var(--soft);font-size:.92rem}
.credit a{color:var(--ink)}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.92rem;color:var(--soft)}
.foot a{color:inherit}
.ptitle{font:italic 500 clamp(2.4rem,7vw,4.4rem)/1 var(--f-display);letter-spacing:-.02em;margin:28px 0 20px}
.pitem{max-width:62ch;padding:16px 0;border-bottom:1px solid var(--line)}
.pitem h2{font:italic 600 1.4rem/1.2 var(--f-display);margin-bottom:4px}
.pitem p{margin:0;color:var(--soft)}

      var im = document.querySelector('.lyr[data-ch="' + c.k + '"]');
      if (b) { b.setAttribute("aria-pressed", String(S.pj.on[c.k])); b.textContent = S.pj.on[c.k] ? PJ.on[S.lang] : PJ.off[S.lang]; }
      if (im) im.classList.toggle("off", !S.pj.on[c.k]);
    });
  }

  function render(focusId) {
    var r = S.view === "recipe" ? byId(S.rid) : null;
    app.innerHTML = S.view === "privacy" ? privacyHTML() : S.view === "project" ? projectHTML() : (r ? recipeHTML(r) : homeHTML());
    if (S.view === "project") layout();
    var pl = document.getElementById("projlink");
    if (S.view === "project") pl.setAttribute("aria-current", "page"); else pl.removeAttribute("aria-current");
    if (focusId) {
      var el = document.getElementById(focusId);
      if (el) el.focus();
    }
  }

  function setWake(on) {
    try {
      if (on && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (w) {
          if (!S.cook) { w.release(); return; }
          wake = w;
        }).catch(function () {});
      } else if (wake) {
        wake.release().catch(function () {});
        wake = null;
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (S.cook && document.visibilityState === "visible") setWake(true);
  });

  function applyLang(l) {
    S.lang = l;
    document.documentElement.lang = l;
    document.getElementById("l-de").setAttribute("aria-pressed", String(l === "de"));
    document.getElementById("l-en").setAttribute("aria-pressed", String(l === "en"));
    document.getElementById("brandtxt").textContent = U("brand");
    document.getElementById("plink").textContent = U("privacy");
    document.getElementById("projlink").textContent = U("project");
    try { localStorage.setItem("lang", l); } catch (e) {}
    render();
  }

  function setView() {
    var id = location.hash.replace("#", "");
    if (id === "datenschutz") { S.view = "privacy"; S.rid = ""; }
    else if (id === "fotoprojekt") { S.view = "project"; S.rid = ""; }
    else if (id && byId(id)) { S.view = "recipe"; S.rid = id; }
    else { S.view = "home"; S.rid = ""; }
  }
  function route() {
    setView();
    render();
    window.scrollTo(0, 0);
  }

  document.querySelector(".top").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (b) applyLang(b.getAttribute("data-lang"));
  });


  window.addEventListener("resize", layout);

  app.addEventListener("pointerdown", function (e) {
    var im = e.target.closest && e.target.closest(".lyr");
    if (!im || (e.button && e.button > 0)) return;
    e.preventDefault();
    var k = im.getAttribute("data-ch");
    selectLayer(k);
    S.pj.touched = true;
    var st = document.getElementById("rgbstage");
    st.classList.remove("anim");
    drag = { k: k, id: e.pointerId, sx: e.clientX, sy: e.clientY, x0: S.pj.x[k], y0: S.pj.y[k], el: im };
    try { im.setPointerCapture(e.pointerId); } catch (err) {}
    im.classList.add("grab");
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    setPos(drag.k, drag.x0 + (e.clientX - drag.sx) / pjScale, drag.y0 + (e.clientY - drag.sy) / pjScale);
    layout();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.el.classList.remove("grab");
    drag = null;
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  app.addEventListener("keydown", function (e) {
    if (!e.target.closest || !e.target.closest("#rgbstage")) return;
    var P = S.pj, step = e.shiftKey ? 10 : 1, dx = 0, dy = 0;
    if (e.key === "1") { selectLayer("r"); return; }
    if (e.key === "2") { selectLayer("g"); return; }
    if (e.key === "3") { selectLayer("b"); return; }
    if (e.key === "ArrowLeft") dx = -step; else if (e.key === "ArrowRight") dx = step;
    else if (e.key === "ArrowUp") dy = -step; else if (e.key === "ArrowDown") dy = step;
    else return;
    e.preventDefault();
    P.touched = true;
    var k = P.active, p = clampPos(k, Math.round(P.x[k]) + dx, Math.round(P.y[k]) + dy);
    P.x[k] = Math.round(p.x); P.y[k] = Math.round(p.y);
    layout();
  });

  app.addEventListener("click", function (e) {
    var sel = e.target.closest("[data-sel]");
    if (sel) { selectLayer(sel.getAttribute("data-sel")); return; }
    var vis = e.target.closest("[data-vis]");
    if (vis) { var vk = vis.getAttribute("data-vis"); S.pj.on[vk] = !S.pj.on[vk]; S.pj.touched = true; refreshEyes(); updateUI(); return; }
    if (e.target.closest("[data-pjreset]")) { pjReset(); return; }
    if (e.target.closest("[data-pjspread]")) { pjSpread(); return; }
    var p = e.target.closest("[data-cat]");
    if (p) { S.cat = p.getAttribute("data-cat"); render("c-" + S.cat); return; }
    var m = e.target.closest("[data-mult]");
    if (m) { S.mult = Number(m.getAttribute("data-mult")); render("m" + S.mult); return; }
    var c = e.target.closest("[data-cook]");
    if (c) { S.cook = !S.cook; setWake(S.cook); render("cook"); return; }
    var s = e.target.closest("[data-step]");
    if (s) {
      var k = s.getAttribute("data-step");
      S.done[k] = !S.done[k];
      s.classList.toggle("is-done", !!S.done[k]);
      s.setAttribute("aria-pressed", String(!!S.done[k]));
    }
  });

  app.addEventListener("change", function (e) {
    if (e.target.closest("[data-snap]")) { S.pj.snap = e.target.checked; return; }
    var cb = e.target.closest("[data-ing]");
    if (!cb) return;
    S.ing[cb.getAttribute("data-ing")] = cb.checked;
    cb.closest(".ing").classList.toggle("is-done", cb.checked);
  });

  window.addEventListener("hashchange", route);

  var saved = "";
  try { saved = localStorage.getItem("lang") || ""; } catch (e) {}
  var start = (saved === "de" || saved === "en") ? saved : ((navigator.language || "de").slice(0, 2) === "de" ? "de" : "en");
  setView();
  applyLang(start);
})();
</script>

</html>

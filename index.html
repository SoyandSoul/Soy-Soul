<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soy &amp; Soul</title>
<meta name="description" content="Games, Tools, Lifestyle und Organisation – kleine Anwendungen, die direkt im Browser laufen.">
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg transform='translate(20 20)'%3E%3Cellipse rx='9.5' ry='6' transform='rotate(-45) translate(0 -8.5)' fill='%23ff6a3d'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(45) translate(0 -8.5)' fill='%232f7bff'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(135) translate(0 -8.5)' fill='%2334c27a'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(225) translate(0 -8.5)' fill='%238b5cf6'/%3E%3C/g%3E%3C/svg%3E">
<style>
@font-face { font-family: "Bricolage"; src: url("assets/fonts/bricolage-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Bricolage"; src: url("assets/fonts/bricolage-latin-ext.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0; }
/* ---------- Grundlagen ---------- */
:root {
  --bg: #fbfbfd; --bg2: #f2f2f6; --card: #ffffff; --ink: #1d1d1f; --ink2: #55555d; --ink3: #6f6f78;
  --line: rgba(0,0,0,.08); --glass: rgba(251,251,253,.72); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(0,0,0,.12);
  --games: #ff6a3d; --tools: #2f7bff; --life: #22b06b; --org: #8b5cf6;
  --games-bg: #fff1eb; --tools-bg: #edf3ff; --life-bg: #eaf8f0; --org-bg: #f3efff;
  --r: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Bricolage", var(--font);
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d; --bg2: #151518; --card: #18181b; --ink: #f5f5f7; --ink2: #b0b0b8; --ink3: #8e8e97;
    --line: rgba(255,255,255,.09); --glass: rgba(11,11,13,.7); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
    --games-bg: #2a1710; --tools-bg: #101b2e; --life-bg: #0f2219; --org-bg: #1c1530;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0d; --bg2: #151518; --card: #18181b; --ink: #f5f5f7; --ink2: #b0b0b8; --ink3: #8e8e97;
  --line: rgba(255,255,255,.09); --glass: rgba(11,11,13,.7); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  --games-bg: #2a1710; --tools-bg: #101b2e; --life-bg: #0f2219; --org-bg: #1c1530;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; }
::selection { background: color-mix(in srgb, var(--games) 28%, transparent); }
:focus-visible { outline: 2px solid var(--games); outline-offset: 3px; border-radius: 6px; }
html { scrollbar-color: color-mix(in srgb, var(--ink) 25%, transparent) transparent; }
h1, h2, h3, .logo { font-family: var(--display); text-wrap: balance; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 600px) { .wrap { padding: 0 16px; } }

/* ---------- Kopfzeile ---------- */
.nav { position: sticky; top: 0; z-index: 50; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid transparent; transition: border-color .3s; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.logo svg ellipse { opacity: .88; }
.logo svg { width: 30px; height: 30px; transition: transform .7s cubic-bezier(.34,1.56,.64,1); }
.logo:hover svg { transform: rotate(90deg) scale(1.08); }
.logo .amp { font-weight: 400; color: var(--games); padding: 0 1px; }
.links { display: flex; gap: 4px; margin-left: auto; }
.links a { font-size: 14px; color: var(--ink2); padding: 7px 13px; border-radius: 99px; transition: background .2s, color .2s; }
.links a:hover { color: var(--ink); background: var(--bg2); }
.links a.on { color: var(--ink); background: var(--bg2); }
.tog { display: flex; gap: 2px; background: var(--bg2); border-radius: 99px; padding: 3px; }
.tog button { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; color: var(--ink3); transition: all .2s; }
.tog button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 820px) { .links { display: none; } .tog { margin-left: auto; } }

/* ---------- Hero ---------- */
.hero { padding: 96px 0 72px; border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(260px, 4fr); gap: 48px 64px; align-items: end; }
.hero h1 { font-size: clamp(46px, 7.6vw, 96px); font-weight: 700; letter-spacing: -.03em; line-height: .98; }
.hero h1 .w { display: inline-block; }
.hero h1 .w:nth-child(2) { font-weight: 300; }
.hero h1 .w:nth-child(4) { font-weight: 300; }
.hero p.lead { font-size: clamp(17px, 1.6vw, 20px); color: var(--ink2); max-width: 44ch; margin-top: 26px; }
.cta { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 12px; transition: transform .25s var(--ease), background .2s, box-shadow .25s; }
.btn.p { background: var(--ink); color: var(--bg); }
.btn.p:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px rgba(0,0,0,.45); }
.btn.s { background: var(--bg2); color: var(--ink); }
.btn.s:hover { background: color-mix(in srgb, var(--ink) 10%, var(--bg2)); }
.btn svg { width: 16px; height: 16px; transition: transform .25s var(--ease); }
.btn:hover svg { transform: translateX(3px); }
/* Inhaltsverzeichnis der Bereiche */
.index { list-style: none; border-top: 1px solid var(--line); }
.index li a { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 14px; padding: 15px 4px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 600; letter-spacing: -.01em; transition: padding-left .3s var(--ease), background .2s; }
.index li a:hover { padding-left: 10px; }
.index i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); transform: rotate(45deg); transition: transform .4s var(--ease); }
.index li a:hover i { transform: rotate(135deg) scale(1.15); }
.index small { font-size: 13px; font-weight: 500; color: var(--ink3); }
.index .n { font-size: 13px; font-weight: 500; color: var(--ink3); }
@media (max-width: 820px) { .hero { padding: 56px 0 48px; } .hero .wrap { grid-template-columns: 1fr; gap: 36px; } }

/* Eintrittsmoment: nur einmal, nur im Hero */
.hero .w, .hero .lead, .hero .cta, .index li { animation: enter .9s var(--ease) both; animation-delay: var(--d, 0s); }
@keyframes enter { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }

/* ---------- Bereiche ---------- */
section.area { padding: 88px 0 0; }
section.area + section.area { margin-top: 24px; }
.head { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); align-items: end; gap: 16px 64px; margin-bottom: 36px; }
.head h2 { font-size: clamp(34px, 4.8vw, 58px); font-weight: 700; letter-spacing: -.03em; line-height: 1.02; }
.head h2 em { font-style: normal; font-weight: 300; }
.head h2::before { content: ""; display: inline-block; width: .42em; height: .42em; border-radius: 3px; background: var(--c); transform: rotate(45deg); margin: 0 .4em .06em .05em; }
.head p { max-width: 38ch; font-size: 16px; color: var(--ink2); }
@media (max-width: 820px) { .head { grid-template-columns: 1fr; } section.area { padding-top: 64px; } }
/* Geplantes: schlichte Liste statt Platzhalter-Karten */
.soonlist { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; font-size: 14px; color: var(--ink2); }
.soonlist > span:first-child { color: var(--ink3); }
.soonlist b { font-weight: 600; color: var(--ink); }
.soonlist b::after { content: " · "; color: var(--ink3); font-weight: 400; }
.soonlist span b:last-child::after { content: ""; }

.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; }
.card { position: relative; display: flex; flex-direction: column; background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); grid-column: span 2; transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
.card.big { grid-column: span 4; grid-row: span 2; }
.card.wide { grid-column: span 3; }
/* Eine App im Bereich: als breite Reihe, Grafik links, Text rechts */
.card.feature { grid-column: span 6; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
a.card:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 28px 56px -24px rgba(0,0,0,.28); }
.art { position: relative; flex: 1; min-height: 210px; display: grid; place-items: center; overflow: hidden; }
.card.big .art { min-height: 380px; }
.card.feature .art { min-height: 360px; }
.art svg { width: 78%; max-width: 360px; height: auto; transition: transform .6s var(--ease); }
.card.big .art svg, .card.feature .art svg { max-width: 520px; }
a.card:hover .art svg { transform: scale(1.04); }
.txt { padding: 22px 24px 24px; }
.card.feature .txt { padding: 36px 40px; display: flex; flex-direction: column; justify-content: center; }
.card.feature .txt h3 { font-size: clamp(26px, 2.6vw, 34px); }
.card.feature .txt p { font-size: 16px; max-width: 46ch; }
@media (max-width: 820px) { .card.feature { grid-template-columns: 1fr; } .card.feature .art { min-height: 240px; } .card.feature .txt { padding: 22px 24px 26px; } }
.txt .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.txt h3 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.card.big .txt h3 { font-size: 30px; }
.ver { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--bg2); color: var(--ink2); }
.txt p { font-size: 15px; color: var(--ink2); line-height: 1.45; }
.card.big .txt p { font-size: 17px; max-width: 560px; }
.go { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 15px; font-weight: 550; }
.go svg { width: 14px; height: 14px; transition: transform .25s; }
a.card:hover .go svg { transform: translateX(4px); }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } .card, .card.wide { grid-column: span 1; } .card.big { grid-column: span 2; grid-row: auto; } .card.big .art { min-height: 280px; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; gap: 14px; } .card, .card.big, .card.wide { grid-column: span 1; } section.area { padding-top: 80px; } }

/* Farbe je Bereich */
[data-a="games"] { --c: var(--games); --cbg: var(--games-bg); }
[data-a="tools"] { --c: var(--tools); --cbg: var(--tools-bg); }
[data-a="life"]  { --c: var(--life);  --cbg: var(--life-bg); }
[data-a="org"]   { --c: var(--org);   --cbg: var(--org-bg); }
.go { color: var(--c); }
.art { background: var(--cbg); }

/* ---------- Grundsätze ---------- */
.band { margin: 96px 0 0; padding: 72px 0; border-top: 1px solid var(--line); }
.band .wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 32px 64px; align-items: start; }
.band h2 { font-size: clamp(28px, 3.6vw, 44px); font-weight: 700; letter-spacing: -.03em; line-height: 1.06; max-width: 22ch; }
.band h2 span { font-weight: 300; }
.band ul { list-style: none; display: grid; gap: 14px; }
.band li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: 15px; color: var(--ink2); line-height: 1.45; }
.band li b { display: block; color: var(--ink); font-weight: 600; }
.band li svg { width: 22px; height: 22px; color: var(--ink); margin-top: 2px; }
@media (max-width: 820px) { .band .wrap { grid-template-columns: 1fr; } .band { padding: 56px 0; margin-top: 64px; } }

/* ---------- Fußzeile ---------- */
footer { padding: 28px 0 44px; font-size: 13px; color: var(--ink3); border-top: 1px solid var(--line); }
footer .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; align-items: center; padding-bottom: 22px; }
footer nav { display: flex; gap: 20px; flex-wrap: wrap; }
footer nav a:hover, footer summary:hover { color: var(--ink); }
footer details { margin-top: 24px; }
footer summary { cursor: pointer; list-style: none; display: inline-block; }
footer summary::-webkit-details-marker { display: none; }
footer .priv { margin-top: 14px; max-width: 700px; display: grid; gap: 10px; line-height: 1.6; }
footer .priv b { color: var(--ink2); }
.theme { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg2); color: var(--ink2); }
.theme svg { width: 16px; height: 16px; }

/* ---------- Grafik-Animationen ---------- */
.mix circle { mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mix circle { mix-blend-mode: screen; } }
:root[data-theme="dark"] .mix circle { mix-blend-mode: screen; }
.a-plane { animation: plane 6s cubic-bezier(.5,0,.6,1) infinite; }
@keyframes plane { 0% { transform: translate(-150px, 0); opacity: 0; } 10% { opacity: 1; } 55% { transform: translate(40px, 0); } 100% { transform: translate(260px, -90px) rotate(-14deg); opacity: 0; } }
.a-spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
.a-spin.fast { animation-duration: 3.2s; }
@keyframes spin { to { transform: rotate(360deg); } }
.a-hop { animation: hop 2.2s cubic-bezier(.3,0,.3,1) infinite; transform-box: fill-box; transform-origin: bottom; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1.05,.95); } 40% { transform: translateY(-22px) scale(.97,1.03); } 60% { transform: translateY(-22px); } }
.a-rise { animation: rise 4s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: bottom; animation-delay: var(--d, 0s); }
@keyframes rise { 0% { transform: scaleY(0); } 30%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
.a-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 5s ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 600; } 45%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
.a-pan { animation: pan 5s ease-in-out infinite alternate; }
@keyframes pan { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
.a-trim { animation: trim 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left; }
@keyframes trim { from { transform: scaleX(.55); } to { transform: scaleX(1.25); } }
.a-drift { animation: drift 5s ease-in-out infinite alternate; transform-box: fill-box; }
@keyframes drift { from { transform: translate(var(--x1, -12px), var(--y1, 0)); } to { transform: translate(var(--x2, 12px), var(--y2, 0)); } }
.a-fly { animation: fly 7s linear infinite; }
@keyframes fly { from { transform: translate(-60px, 20px); } to { transform: translate(300px, -20px); } }
.a-blink { animation: blink 1.6s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.a-pulse { animation: apulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; animation-delay: var(--d, 0s); }
@keyframes apulse { 50% { transform: scale(.82); opacity: .55; } }
.a-shuffle { animation: shuffle 3s cubic-bezier(.6,0,.2,1) infinite; transform-box: fill-box; animation-delay: var(--d, 0s); }
@keyframes shuffle { 0%,20% { transform: translate(0,0); } 40%,70% { transform: translate(var(--x, 10px), var(--y, -10px)); } 90%,100% { transform: translate(0,0); } }
.a-check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: check 4s ease infinite; animation-delay: var(--d, 0s); }
@keyframes check { 0%, 15% { stroke-dashoffset: 30; } 30%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .a-draw { stroke-dashoffset: 0; } .a-check { stroke-dashoffset: 0; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Soy &amp; Soul – Start">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <g transform="translate(20 20)">
          <ellipse rx="9.5" ry="6" transform="rotate(-45) translate(0 -8.5)" fill="var(--games)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(45) translate(0 -8.5)" fill="var(--tools)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(135) translate(0 -8.5)" fill="var(--life)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(225) translate(0 -8.5)" fill="var(--org)"/>
          <circle r="3" fill="var(--bg)"/>
        </g>
      </svg>
      <span>soy<span class="amp">&amp;</span>soul</span>
    </a>
    <nav class="links" id="links"></nav>
    <div class="tog" role="group" aria-label="Sprache">
      <button data-lang="de" aria-pressed="true">DE</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 id="h1"></h1>
        <p class="lead" style="--d:.35s" data-t="lead"></p>
        <div class="cta" style="--d:.45s">
          <a class="btn p" href="#games"><span data-t="ctaP"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
          <a class="btn s" href="#tools"><span data-t="ctaS"></span></a>
        </div>
      </div>
      <ul class="index" id="quad"></ul>
    </div>
  </section>

  <div id="areas"></div>

  <section class="band">
    <div class="wrap">
      <h2 data-t="band"></h2>
      <ul id="principles"></ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="row">
      <a class="logo" href="#top" id="flogo"></a>
      <nav id="flinks"></nav>
      <button class="theme" id="theme" aria-label="Hell / Dunkel"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.5v11a5.5 5.5 0 0 1 0-11Z"/></svg></button>
    </div>
    <details>
      <summary data-t="privH"></summary>
      <div class="priv" id="priv"></div>
    </details>
    <p style="margin-top:22px" id="copy"></p>
  </div>
</footer>

<script>
(function () {
  // >>> Hier Name, Ort und E-Mail für den Datenschutzhinweis eintragen <<<
  var VERANTWORTLICH = "N. Schulz, Frankfurt am Main";

  var T = {
    h1: { de: ["Spielen.", "Bauen.", "Leben.", "Ordnen."], en: ["Play.", "Build.", "Live.", "Organise."] },
    lead: { de: "Kleine Anwendungen, die direkt im Browser laufen. Ohne Konto, ohne Werbung, deine Dateien bleiben auf deinem Gerät.", en: "Small apps that run right in your browser. No account, no ads, your files stay on your device." },
    ctaP: { de: "Spiele entdecken", en: "Explore games" },
    ctaS: { de: "Zu den Tools", en: "See the tools" },
    open: { de: "Öffnen", en: "Open" },
    soon: { de: "In Arbeit", en: "In the works" },
    apps: { de: ["App", "Apps"], en: ["app", "apps"] },
    band: { de: 'Alles läuft in deinem Browser. <span>Deshalb braucht nichts hier ein Konto.</span>', en: 'Everything runs in your browser. <span>That is why nothing here needs an account.</span>' },

  var L = "de";
  function t(o) { return o[L]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function cardHTML(it, size) {
    var top = '<div class="top"><h3>' + esc(t(it.name)) + '</h3>' + (it.ver ? '<span class="ver">' + it.ver + '</span>' : '') + '</div>';
    var inner = '<div class="art" aria-hidden="true">' + ART[it.art] + '</div><div class="txt">' + top + '<p>' + esc(t(it.d)) + '</p><span class="go">' + t(T.open) + ARROW + '</span></div>';
    return '<a class="card ' + size + '" href="' + it.href + '">' + inner + '</a>';
  }
  function sectionBody(list) {
    var live = list.filter(function (it) { return it.href; }), soon = list.filter(function (it) { return !it.href; });
    var h = "";
    if (live.length === 1) h += '<div class="grid">' + cardHTML(live[0], "feature") + '</div>';
    else if (live.length) h += '<div class="grid">' + live.map(function (it, i) { return cardHTML(it, i === 0 ? "big" : ""); }).join("") + '</div>';
    if (soon.length) h += '<p class="soonlist"><span>' + t(T.soon) + ':</span><span>' + soon.map(function (it) { return "<b>" + esc(t(it.name)) + "</b>"; }).join("") + '</span></p>';
    return h;
  }

  function render() {
    document.documentElement.lang = L;
    [].forEach.call(document.querySelectorAll("[data-t]"), function (el) { el.innerHTML = t(T[el.getAttribute("data-t")]); });
    document.getElementById("h1").innerHTML = t(T.h1).map(function (w, i) { return '<span class="w" style="--d:' + (i * .09) + 's">' + w + '</span>'; }).join(" ");

    document.getElementById("links").innerHTML = AREAS.map(function (a) { return '<a href="#' + a.id + '" data-sec="' + a.id + '">' + t(a.name) + '</a>'; }).join("");
    document.getElementById("flinks").innerHTML = AREAS.map(function (a) { return '<a href="#' + a.id + '">' + t(a.name) + '</a>'; }).join("");

    document.getElementById("quad").innerHTML = AREAS.map(function (a, i) {
      var n = ITEMS[a.id].filter(function (it) { return it.href; }).length;
      return '<li data-a="' + a.a + '" style="--d:' + (.5 + i * .08) + 's"><a href="#' + a.id + '"><i></i><span>' + t(a.name) + ' <small>' + t(a.sub) + '</small></span><span class="n">' + (n ? n + " " + t(T.apps)[n === 1 ? 0 : 1] : t(T.soon)) + '</span></a></li>';
    }).join("");

    document.getElementById("areas").innerHTML = AREAS.map(function (a) {
      return '<section class="area" id="' + a.id + '" data-a="' + a.a + '"><div class="wrap">' +
        '<div class="head"><h2>' + t(a.h) + '</h2><p>' + t(a.p) + '</p></div>' + sectionBody(ITEMS[a.id]) + '</div></section>';
    }).join("");

    document.getElementById("principles").innerHTML = [["pr1", ICONP.key], ["pr2", ICONP.device], ["pr3", ICONP.open]].map(function (x) {
      var p = t(T[x[0]]); return '<li>' + x[1] + '<span><b>' + p[0] + '</b>' + p[1] + '</span></li>';
    }).join("");

    document.getElementById("flogo").innerHTML = document.querySelector(".nav .logo").innerHTML;
    document.getElementById("priv").innerHTML = PRIV.map(function (p) { return "<p>" + t(p) + "</p>"; }).join("");
    document.getElementById("copy").textContent = "© " + new Date().getFullYear() + " Soy & Soul · " + t(T.copy);

    [].forEach.call(document.querySelectorAll(".tog button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === L)); });
  }

  /* ---------- Kopfzeile: Rand + aktiver Bereich ---------- */
  var nav = document.getElementById("nav");
  function onScroll() {
    nav.classList.toggle("scrolled", window.scrollY > 8);
    var cur = "";
    AREAS.forEach(function (a) { var s = document.getElementById(a.id); if (s && s.getBoundingClientRect().top < 160) cur = a.id; });
    [].forEach.call(document.querySelectorAll(".links a"), function (l) { l.classList.toggle("on", l.getAttribute("data-sec") === cur); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* ---------- Sprache & Hell/Dunkel ---------- */
  document.querySelector(".tog").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    L = b.getAttribute("data-lang");
    try { localStorage.setItem("ss-lang", L); } catch (er) {}
    render(); onScroll();
  });
  document.getElementById("theme").addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("ss-theme", next); } catch (er) {}
  });

  try {
    var sl = localStorage.getItem("ss-lang"), th = localStorage.getItem("ss-theme");
    if (sl === "de" || sl === "en") L = sl; else L = (navigator.language || "de").slice(0, 2) === "de" ? "de" : "en";
    if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
  } catch (er) {}
  render(); onScroll();
})();
</script>
</body>
</html>

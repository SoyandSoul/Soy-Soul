<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soy &amp; Soul</title>
<meta name="description" content="Games, Tools, Lifestyle und Organisation – kleine Anwendungen, die direkt im Browser laufen.">
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg transform='translate(20 20)'%3E%3Cellipse rx='9.5' ry='6' transform='rotate(-45) translate(0 -8.5)' fill='%23ff6a3d'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(45) translate(0 -8.5)' fill='%232f7bff'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(135) translate(0 -8.5)' fill='%2334c27a'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(225) translate(0 -8.5)' fill='%238b5cf6'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ---------- Grundlagen ---------- */
:root {
  --bg: #fbfbfd; --bg2: #f2f2f6; --card: #ffffff; --ink: #1d1d1f; --ink2: #5e5e66; --ink3: #8a8a93;
  --line: rgba(0,0,0,.08); --glass: rgba(251,251,253,.72); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(0,0,0,.12);
  --games: #ff6a3d; --tools: #2f7bff; --life: #22b06b; --org: #8b5cf6;
  --games-bg: #fff1eb; --tools-bg: #edf3ff; --life-bg: #eaf8f0; --org-bg: #f3efff;
  --r: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0d; --bg2: #151518; --card: #18181b; --ink: #f5f5f7; --ink2: #a8a8b0; --ink3: #77777f;
    --line: rgba(255,255,255,.09); --glass: rgba(11,11,13,.7); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
    --games-bg: #2a1710; --tools-bg: #101b2e; --life-bg: #0f2219; --org-bg: #1c1530;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0d; --bg2: #151518; --card: #18181b; --ink: #f5f5f7; --ink2: #a8a8b0; --ink3: #77777f;
  --line: rgba(255,255,255,.09); --glass: rgba(11,11,13,.7); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  --games-bg: #2a1710; --tools-bg: #101b2e; --life-bg: #0f2219; --org-bg: #1c1530;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 600px) { .wrap { padding: 0 16px; } }

/* ---------- Kopfzeile ---------- */
.nav { position: sticky; top: 0; z-index: 50; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid transparent; transition: border-color .3s; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 19px; letter-spacing: -.02em; }
.logo svg ellipse { opacity: .88; }
.logo svg { width: 30px; height: 30px; transition: transform .7s cubic-bezier(.34,1.56,.64,1); }
.logo:hover svg { transform: rotate(90deg) scale(1.08); }
.logo .amp { font-weight: 400; background: linear-gradient(120deg, var(--games), var(--org) 50%, var(--tools)); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 1px; }
.links { display: flex; gap: 4px; margin-left: auto; }
.links a { font-size: 14px; color: var(--ink2); padding: 7px 13px; border-radius: 99px; transition: background .2s, color .2s; }
.links a:hover { color: var(--ink); background: var(--bg2); }
.links a.on { color: var(--ink); background: var(--bg2); }
.tog { display: flex; gap: 2px; background: var(--bg2); border-radius: 99px; padding: 3px; }
.tog button { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; color: var(--ink3); transition: all .2s; }
.tog button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 820px) { .links { display: none; } .tog { margin-left: auto; } }

/* ---------- Hero ---------- */
.hero { position: relative; padding: 110px 0 90px; text-align: center; overflow: hidden; }
.blobs { position: absolute; inset: -20% -10% auto; height: 140%; pointer-events: none; filter: blur(60px); opacity: .55; }
.blobs span { position: absolute; width: 38vw; height: 38vw; max-width: 520px; max-height: 520px; border-radius: 50%; animation: float 18s ease-in-out infinite; }
.blobs span:nth-child(1) { background: var(--games); left: 6%; top: 8%; }
.blobs span:nth-child(2) { background: var(--tools); right: 4%; top: 2%; animation-delay: -5s; }
.blobs span:nth-child(3) { background: var(--life); left: 30%; top: 38%; animation-delay: -10s; opacity: .7; }
.blobs span:nth-child(4) { background: var(--org); right: 22%; top: 46%; animation-delay: -14s; opacity: .7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .blobs { opacity: .32; } }
:root[data-theme="dark"] .blobs { opacity: .32; }
@keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(6%,-8%) scale(1.08); } 66% { transform: translate(-7%,6%) scale(.94); } }
.hero .wrap { position: relative; }
.badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink2); background: var(--glass); border: 1px solid var(--line); padding: 6px 14px 6px 8px; border-radius: 99px; backdrop-filter: blur(10px); }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--life); box-shadow: 0 0 0 4px color-mix(in srgb, var(--life) 25%, transparent); animation: pulse 2.4s infinite; font-style: normal; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--life) 0%, transparent); } }
.hero h1 { font-size: clamp(44px, 8.4vw, 104px); font-weight: 700; letter-spacing: -.045em; line-height: 1.02; margin: 26px 0 22px; }
.hero h1 .w { display: inline-block; }
.hero h1 .w:nth-child(1) { color: var(--games); }
.hero h1 .w:nth-child(2) { color: var(--tools); }
.hero h1 .w:nth-child(3) { color: var(--life); }
.hero h1 .w:nth-child(4) { color: var(--org); }
.hero p.lead { font-size: clamp(18px, 2.2vw, 23px); color: var(--ink2); max-width: 640px; margin: 0 auto; letter-spacing: -.01em; }
.cta { display: flex; gap: 12px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 550; padding: 13px 24px; border-radius: 99px; transition: transform .2s, background .2s, box-shadow .2s; }
.btn.p { background: var(--ink); color: var(--bg); }
.btn.p:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -10px rgba(0,0,0,.4); }
.btn.s { color: var(--tools); }
.btn.s:hover { background: color-mix(in srgb, var(--tools) 10%, transparent); }
.btn svg { width: 16px; height: 16px; transition: transform .25s; }
.btn:hover svg { transform: translateX(3px); }

/* Bereichs-Kacheln unter dem Hero */
.quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 72px; }
.quad a { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; overflow: hidden; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; box-shadow: var(--shadow); }
.quad a:hover { transform: translateY(-4px); }
.quad .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 26px; }
.quad .ic svg { width: 22px; height: 22px; }
.quad b { display: block; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
.quad small { font-size: 14px; color: var(--ink3); }
.quad .n { position: absolute; top: 18px; right: 20px; font-size: 13px; font-weight: 600; color: var(--ink3); font-variant-numeric: tabular-nums; }
@media (max-width: 820px) { .quad { grid-template-columns: 1fr 1fr; } }

/* ---------- Bereiche ---------- */
section.area { padding: 110px 0 30px; }
.head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; margin-bottom: 44px; }
.eyebrow { font-size: 15px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.eyebrow span { font-variant-numeric: tabular-nums; color: var(--ink3); font-weight: 500; }
.head h2 { font-size: clamp(36px, 5.6vw, 64px); font-weight: 700; letter-spacing: -.04em; line-height: 1.04; }
.head h2 em { font-style: normal; color: var(--ink3); }
.head p { max-width: 400px; font-size: 17px; color: var(--ink2); }
@media (max-width: 820px) { .head { grid-template-columns: 1fr; } }

.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; }
.card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); grid-column: span 2; transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s; }
.card.big { grid-column: span 4; grid-row: span 2; }
.card.wide { grid-column: span 3; }
a.card:hover { transform: translateY(-6px) scale(1.005); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 30px 60px -24px rgba(0,0,0,.25); }
.art { position: relative; flex: 1; min-height: 210px; display: grid; place-items: center; overflow: hidden; }
.card.big .art { min-height: 380px; }
.art svg { width: 78%; max-width: 360px; height: auto; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.card.big .art svg { max-width: 520px; }
a.card:hover .art svg { transform: scale(1.06); }
.txt { padding: 22px 24px 24px; }
.txt .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.txt h3 { font-size: 21px; font-weight: 650; letter-spacing: -.025em; }
.card.big .txt h3 { font-size: 30px; }
.ver { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg2); color: var(--ink2); font-variant-numeric: tabular-nums; }
.soon { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.txt p { font-size: 15px; color: var(--ink2); line-height: 1.45; }
.card.big .txt p { font-size: 17px; max-width: 560px; }
.go { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 15px; font-weight: 550; }
.go svg { width: 14px; height: 14px; transition: transform .25s; }
a.card:hover .go svg { transform: translateX(4px); }
.card.dim .art { filter: saturate(.75); }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } .card, .card.wide { grid-column: span 1; } .card.big { grid-column: span 2; grid-row: auto; } .card.big .art { min-height: 280px; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; gap: 14px; } .card, .card.big, .card.wide { grid-column: span 1; } section.area { padding-top: 80px; } }

/* Farbe je Bereich */
[data-a="games"] { --c: var(--games); --cbg: var(--games-bg); }
[data-a="tools"] { --c: var(--tools); --cbg: var(--tools-bg); }
[data-a="life"]  { --c: var(--life);  --cbg: var(--life-bg); }
[data-a="org"]   { --c: var(--org);   --cbg: var(--org-bg); }
.eyebrow, .go { color: var(--c); }
.art { background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--c) 14%, var(--cbg)), var(--cbg)); }
.soon { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.quad .ic { background: var(--cbg); color: var(--c); }

/* ---------- Statement-Band ---------- */
.band { margin: 120px 0 0; padding: 120px 0; background: var(--ink); color: var(--bg); text-align: center; position: relative; overflow: hidden; }
.band h2 { font-size: clamp(32px, 5vw, 58px); font-weight: 700; letter-spacing: -.04em; line-height: 1.08; max-width: 860px; margin: 0 auto; }
.band h2 span { color: color-mix(in srgb, var(--bg) 45%, var(--ink)); }
.stats { display: flex; justify-content: center; gap: clamp(28px, 8vw, 110px); margin-top: 64px; flex-wrap: wrap; }
.stats div b { display: block; font-size: clamp(40px, 6vw, 68px); font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.stats div small { font-size: 15px; color: color-mix(in srgb, var(--bg) 55%, var(--ink)); }

/* ---------- Fußzeile ---------- */
footer { padding: 70px 0 50px; font-size: 13px; color: var(--ink3); }
footer .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; align-items: center; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
footer nav { display: flex; gap: 20px; flex-wrap: wrap; }
footer nav a:hover, footer summary:hover { color: var(--ink); }
footer details { margin-top: 24px; }
footer summary { cursor: pointer; list-style: none; display: inline-block; }
footer summary::-webkit-details-marker { display: none; }
footer .priv { margin-top: 14px; max-width: 700px; display: grid; gap: 10px; line-height: 1.6; }
footer .priv b { color: var(--ink2); }
.theme { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg2); color: var(--ink2); }
.theme svg { width: 16px; height: 16px; }

/* ---------- Scroll-Animationen ---------- */
.rv { opacity: 0; transform: translateY(36px); transition: opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.rv.in { opacity: 1; transform: none; }
.hero .rv { transform: translateY(24px) scale(.98); }

/* ---------- Grafik-Animationen ---------- */
.mix circle { mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mix circle { mix-blend-mode: screen; } }
:root[data-theme="dark"] .mix circle { mix-blend-mode: screen; }
.a-plane { animation: plane 6s cubic-bezier(.5,0,.6,1) infinite; }
@keyframes plane { 0% { transform: translate(-150px, 0); opacity: 0; } 10% { opacity: 1; } 55% { transform: translate(40px, 0); } 100% { transform: translate(260px, -90px) rotate(-14deg); opacity: 0; } }
.a-spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
.a-spin.fast { animation-duration: 3.2s; }
@keyframes spin { to { transform: rotate(360deg); } }
.a-hop { animation: hop 2.2s cubic-bezier(.3,0,.3,1) infinite; transform-box: fill-box; transform-origin: bottom; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1.05,.95); } 40% { transform: translateY(-22px) scale(.97,1.03); } 60% { transform: translateY(-22px); } }
.a-rise { animation: rise 4s cubic-bezier(.2,.8,.2,1) infinite; transform-box: fill-box; transform-origin: bottom; animation-delay: var(--d, 0s); }
@keyframes rise { 0% { transform: scaleY(0); } 30%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
.a-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 5s ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 600; } 45%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
.a-pan { animation: pan 5s ease-in-out infinite alternate; }
@keyframes pan { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
.a-drift { animation: drift 5s ease-in-out infinite alternate; transform-box: fill-box; }
@keyframes drift { from { transform: translate(var(--x1, -12px), var(--y1, 0)); } to { transform: translate(var(--x2, 12px), var(--y2, 0)); } }
.a-fly { animation: fly 7s linear infinite; }
@keyframes fly { from { transform: translate(-60px, 20px); } to { transform: translate(300px, -20px); } }
.a-blink { animation: blink 1.6s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.a-pulse { animation: apulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; animation-delay: var(--d, 0s); }
@keyframes apulse { 50% { transform: scale(.82); opacity: .55; } }
.a-shuffle { animation: shuffle 3s cubic-bezier(.6,0,.2,1) infinite; transform-box: fill-box; animation-delay: var(--d, 0s); }
@keyframes shuffle { 0%,20% { transform: translate(0,0); } 40%,70% { transform: translate(var(--x, 10px), var(--y, -10px)); } 90%,100% { transform: translate(0,0); } }
.a-check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: check 4s ease infinite; animation-delay: var(--d, 0s); }
@keyframes check { 0%, 15% { stroke-dashoffset: 30; } 30%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rv { opacity: 1; transform: none; }
  .a-draw { stroke-dashoffset: 0; } .a-check { stroke-dashoffset: 0; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Soy &amp; Soul – Start">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <g transform="translate(20 20)">
          <ellipse rx="9.5" ry="6" transform="rotate(-45) translate(0 -8.5)" fill="var(--games)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(45) translate(0 -8.5)" fill="var(--tools)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(135) translate(0 -8.5)" fill="var(--life)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(225) translate(0 -8.5)" fill="var(--org)"/>
          <circle r="3" fill="var(--bg)"/>
        </g>
      </svg>
      <span>soy<span class="amp">&amp;</span>soul</span>
    </a>
    <nav class="links" id="links"></nav>
    <div class="tog" role="group" aria-label="Sprache">
      <button data-lang="de" aria-pressed="true">DE</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="wrap">
      <div class="badge rv"><i></i><span data-t="badge"></span></div>
      <h1 class="rv" style="--d:.08s" id="h1"></h1>
      <p class="lead rv" style="--d:.16s" data-t="lead"></p>
      <div class="cta rv" style="--d:.24s">
        <a class="btn p" href="#games"><span data-t="ctaP"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
        <a class="btn s" href="#tools"><span data-t="ctaS"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></a>
      </div>
      <div class="quad" id="quad"></div>
    </div>
  </section>

  <div id="areas"></div>

  <section class="band">
    <div class="wrap">
      <h2 class="rv" data-t="band"></h2>
      <div class="stats rv" style="--d:.1s" id="stats"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="row">
      <a class="logo" href="#top" id="flogo"></a>
      <nav id="flinks"></nav>
      <button class="theme" id="theme" aria-label="Hell / Dunkel"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.5v11a5.5 5.5 0 0 1 0-11Z"/></svg></button>
    </div>
    <details>
      <summary data-t="privH"></summary>
      <div class="priv" id="priv"></div>
    </details>
    <p style="margin-top:22px" id="copy"></p>
  </div>
</footer>

<script>
(function () {
  // >>> Hier Name, Ort und E-Mail für den Datenschutzhinweis eintragen <<<
  var VERANTWORTLICH = "N. Schulz, Frankfurt am Main";

  var T = {
    badge: { de: "Neustart – die ersten Projekte entstehen", en: "Fresh start – first projects underway" },
    h1: { de: ["Spielen.", "Bauen.", "Leben.", "Ordnen."], en: ["Play.", "Build.", "Live.", "Organise."] },
    lead: { de: "Kleine Anwendungen, die direkt im Browser laufen. Ohne Konto, ohne Werbung, deine Dateien bleiben auf deinem Gerät.", en: "Small apps that run right in your browser. No account, no ads, your files stay on your device." },
    ctaP: { de: "Spiele entdecken", en: "Explore games" },
    ctaS: { de: "Zu den Tools", en: "See the tools" },
    open: { de: "Öffnen", en: "Open" },
    soon: { de: "In Planung", en: "Planned" },
    band: { de: 'Alles läuft lokal. <span>Kein Upload, kein Tracking, keine Werbung. Einfach öffnen und loslegen.</span>', en: 'Everything runs locally. <span>No uploads, no tracking, no ads. Just open it and go.</span>' },
    stCookies: { de: "Cookies", en: "Cookies" },
    stAreas: { de: "Bereiche", en: "Areas" },
    stCost: { de: "Kosten", en: "Cost" },
    privH: { de: "Datenschutz", en: "Privacy" },
    copy: { de: "Privat betrieben, ohne Werbung. Gehostet auf GitHub Pages.", en: "Run privately, without ads. Hosted on GitHub Pages." }
  };

  var AREAS = [
    { id: "games", a: "games", n: "01", name: { de: "Games", en: "Games" },

      '<g class="a-drift" style="--x1:0px;--x2:0px;--y1:6px;--y2:-6px"><rect x="160" y="62" width="70" height="70" rx="16" fill="' + C + '" transform="rotate(12 195 97)"/>' +
      '<g fill="' + CARD + '"><circle cx="182" cy="82" r="6"/><circle cx="208" cy="112" r="6"/></g></g></svg>',

      '<g class="a-hop"><circle cx="150" cy="40" r="10" fill="' + C + '"/></g></svg>',
    sliders:
      '<svg viewBox="0 0 300 180"><rect x="70" y="30" width="160" height="120" rx="18" fill="' + CARD + '"/>' +
      [0, 1, 2].map(function (i) {
        var y = 62 + i * 28;
        return '<rect x="92" y="' + (y - 3) + '" width="116" height="6" rx="3" fill="' + INK + '" opacity=".15"/>' +
          '<circle class="a-drift" style="--x1:' + [-30, 20, -10][i] + 'px;--x2:' + [30, -25, 35][i] + 'px;animation-delay:' + (i * -.9) + 's" cx="150" cy="' + y + '" r="9" fill="' + C + '" opacity="' + [1, .7, .45][i] + '"/>';
      }).join("") + '</svg>',
    calc: (function () {

        '<rect class="a-blink" x="172" y="43" width="4" height="14" rx="2" fill="' + C + '"/>';
      for (var i = 0; i < 9; i++) s += '<rect class="' + (i === 4 ? "a-pulse" : "") + '" x="' + (114 + (i % 3) * 26) + '" y="' + (76 + Math.floor(i / 3) * 26) + '" width="20" height="20" rx="6" fill="' + (i === 8 ? C : INK) + '" opacity="' + (i === 8 ? 1 : .15) + '"/>';
      return s + '</svg>';
    })(),
    bowl:
      '<svg viewBox="0 0 300 180"><g fill="none" stroke="' + C + '" stroke-width="4" stroke-linecap="round" opacity=".6">' +
      '<path class="a-drift" style="--x1:0px;--x2:0px;--y1:4px;--y2:-6px" d="M120 60 q-8 -14 0 -26 q8 -12 0 -24"/>' +
      '<path class="a-drift" style="--x1:0px;--x2:0px;--y1:-4px;--y2:6px" d="M150 56 q-8 -14 0 -26 q8 -12 0 -24"/>' +
      '<path class="a-drift" style="--x1:0px;--x2:0px;--y1:4px;--y2:-6px" d="M180 60 q-8 -14 0 -26 q8 -12 0 -24"/></g>' +
      '<path d="M70 86 H230 Q226 160 150 160 Q74 160 70 86 Z" fill="' + CARD + '"/><path d="M70 86 H230" stroke="' + C + '" stroke-width="6" stroke-linecap="round"/>' +
      '<line x1="200" y1="40" x2="240" y2="96" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/><line x1="212" y1="36" x2="250" y2="92" stroke="' + INK + '" stroke-width="4" stroke-linecap="round"/></svg>',
    camera:
      '<svg viewBox="0 0 300 180"><rect x="80" y="54" width="140" height="92" rx="16" fill="' + CARD + '"/><rect x="118" y="42" width="44" height="18" rx="5" fill="' + CARD + '"/>' +
      '<circle cx="150" cy="100" r="30" fill="' + C + '" opacity=".25"/><circle class="a-pulse" cx="150" cy="100" r="20" fill="' + C + '"/><circle cx="198" cy="70" r="5" fill="' + C + '"/></svg>',
    list:
      '<svg viewBox="0 0 240 200"><rect x="50" y="30" width="140" height="140" rx="16" fill="' + CARD + '"/>' +
      [0, 1, 2].map(function (i) {
        var y = 64 + i * 36;
        return '<rect x="68" y="' + (y - 10) + '" width="20" height="20" rx="6" fill="' + C + '" opacity=".18"/>' +
          '<path class="a-check" style="--d:' + (i * .4) + 's" d="M72 ' + y + ' l5 5 l9 -10" fill="none" stroke="' + C + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<rect x="100" y="' + (y - 4) + '" width="' + [70, 52, 62][i] + '" height="8" rx="4" fill="' + INK + '" opacity=".25"/>';
      }).join("") + '</svg>',
    cal: (function () {
      var s = '<svg viewBox="0 0 240 200"><rect x="50" y="34" width="140" height="132" rx="16" fill="' + CARD + '"/><rect x="50" y="34" width="140" height="30" rx="16" fill="' + C + '"/><rect x="50" y="50" width="140" height="14" fill="' + C + '"/>';
      for (var i = 0; i < 15; i++) {
        var x = 66 + (i % 5) * 23, y = 78 + Math.floor(i / 5) * 26;
        s += i === 7 ? '<circle class="a-pulse" cx="' + (x + 6) + '" cy="' + (y + 6) + '" r="10" fill="' + C + '"/>' : '<rect x="' + x + '" y="' + y + '" width="12" height="12" rx="3" fill="' + INK + '" opacity=".14"/>';
      }
      return s + '</svg>';
    })(),
    note:
      '<svg viewBox="0 0 240 200"><g transform="rotate(-4 120 100)"><rect x="62" y="36" width="116" height="128" rx="14" fill="' + CARD + '"/>' +
      '<g stroke="' + INK + '" stroke-width="5" stroke-linecap="round" opacity=".22"><line x1="82" y1="70" x2="156" y2="70"/><line x1="82" y1="94" x2="146" y2="94"/></g>' +
      '<line class="a-draw" x1="82" y1="118" x2="150" y2="118" stroke="' + C + '" stroke-width="5" stroke-linecap="round"/></g>' +
      '<g transform="rotate(35 170 70)"><rect x="164" y="40" width="12" height="66" rx="4" fill="' + C + '"/></g></svg>'
  };

  var ICON = {
    games: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11.5" r=".6" fill="currentColor"/><circle cx="18" cy="13.5" r=".6" fill="currentColor"/></svg>',
    tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L3.5 17.5l3 3 5.7-5.7a4 4 0 0 0 5.3-5.3l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
    life: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 16.5 12 21 12 21z"/></svg>',
    org: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>'
  };
  var ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';


  var PRIV = [
    { de: "<b>Kurz gesagt.</b> Diese Seite wird privat betrieben, ohne Werbung, ohne Cookies, ohne Tracking und ohne Nutzerprofile.", en: "<b>In short.</b> This site is run privately, with no ads, no cookies, no tracking and no user profiles." },
    { de: "<b>Verantwortlich.</b> " + VERANTWORTLICH, en: "<b>Responsible.</b> " + VERANTWORTLICH },
    { de: "<b>Hosting.</b> Die Seite liegt bei GitHub Pages (GitHub Inc., USA). Beim Aufruf verarbeitet der Anbieter technisch notwendige Daten wie IP-Adresse und Zeitpunkt in Server-Logs.", en: "<b>Hosting.</b> The site is hosted on GitHub Pages (GitHub Inc., USA). When you open it, the provider processes technically necessary data such as IP address and time in server logs." },
    { de: "<b>Schrift.</b> Es wird die Systemschrift deines Geräts verwendet, es werden keine Schriften von Google oder anderen Diensten geladen.", en: "<b>Font.</b> Your device's system font is used; no fonts are loaded from Google or other services." },
    { de: "<b>Einstellungen.</b> Deine Wahl von Sprache und Hell/Dunkel wird nur lokal in deinem Browser gespeichert.", en: "<b>Settings.</b> Your choice of language and light/dark mode is stored only locally in your browser." }
  ];

  var L = "de";
  function t(o) { return o[L]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function cardHTML(it, area, i) {
    var cls = "card rv" + (it.size ? " " + it.size : "") + (it.id ? "" : " dim");
    var top = '<div class="top"><h3>' + esc(t(it.name)) + '</h3>' + (it.ver ? '<span class="ver">' + it.ver + '</span>' : '<span class="soon">' + t(T.soon) + '</span>') + '</div>';
    var go = it.id ? '<span class="go">' + t(T.open) + ARROW + '</span>' : "";
    var inner = '<div class="art" aria-hidden="true">' + ART[it.art] + '</div><div class="txt">' + top + '<p>' + esc(t(it.d)) + '</p>' + go + '</div>';
    var st = ' style="--d:' + (i * .07).toFixed(2) + 's"';
    return '<div class="' + cls + '"' + st + '>' + inner + '</div>';
  }

  function render() {
    document.documentElement.lang = L;
    [].forEach.call(document.querySelectorAll("[data-t]"), function (el) { el.innerHTML = t(T[el.getAttribute("data-t")]); });
    document.getElementById("h1").innerHTML = t(T.h1).map(function (w) { return '<span class="w">' + w + '</span>'; }).join(" ");

    document.getElementById("links").innerHTML = AREAS.map(function (a) { return '<a href="#' + a.id + '" data-sec="' + a.id + '">' + t(a.name) + '</a>'; }).join("");
    document.getElementById("flinks").innerHTML = AREAS.map(function (a) { return '<a href="#' + a.id + '">' + t(a.name) + '</a>'; }).join("");

    document.getElementById("quad").innerHTML = AREAS.map(function (a, i) {
      return '<a class="rv" data-a="' + a.a + '" style="--d:' + (.3 + i * .07) + 's" href="#' + a.id + '"><span class="n">' + a.n + '</span><div class="ic">' + ICON[a.a] + '</div><b>' + t(a.name) + '</b><small>' + t(a.sub) + '</small></a>';
    }).join("");

    document.getElementById("areas").innerHTML = AREAS.map(function (a) {
      return '<section class="area" id="' + a.id + '" data-a="' + a.a + '"><div class="wrap">' +
        '<div class="head rv"><div><div class="eyebrow">' + t(a.name) + ' <span>' + a.n + '</span></div><h2>' + t(a.h) + '</h2></div><p>' + t(a.p) + '</p></div>' +
        '<div class="grid">' + ITEMS[a.id].map(function (it, i) { return cardHTML(it, a, i); }).join("") + '</div></div></section>';
    }).join("");

    var st = document.getElementById("stats"), done = st.classList.contains("in");
    st.innerHTML =
      '<div><b data-count="4">0</b><small>' + t(T.stAreas) + '</small></div>' +
      '<div><b>0</b><small>' + t(T.stCookies) + '</small></div>' +
      '<div><b>0 €</b><small>' + t(T.stCost) + '</small></div>';
    if (done) [].forEach.call(st.querySelectorAll("[data-count]"), function (b) { b.textContent = b.getAttribute("data-count"); });

    document.getElementById("flogo").innerHTML = document.querySelector(".nav .logo").innerHTML;
    document.getElementById("priv").innerHTML = PRIV.map(function (p) { return "<p>" + t(p) + "</p>"; }).join("");
    document.getElementById("copy").textContent = "© " + new Date().getFullYear() + " Soy & Soul · " + t(T.copy);

    [].forEach.call(document.querySelectorAll(".tog button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === L)); });
    observe();
  }

  /* ---------- Einblenden beim Scrollen ---------- */
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      io.unobserve(e.target);
      [].forEach.call(e.target.querySelectorAll("[data-count]"), countUp);
    });
  }, { threshold: .12, rootMargin: "0px 0px -40px 0px" }) : null;
  function observe() {
    [].forEach.call(document.querySelectorAll(".rv:not(.in)"), function (el) { io ? io.observe(el) : el.classList.add("in"); });
    if (!io) [].forEach.call(document.querySelectorAll("[data-count]"), countUp);
  }
  function countUp(el) {
    var to = +el.getAttribute("data-count"), t0 = performance.now(), dur = 1200;
    (function step(now) {
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* ---------- Kopfzeile: Rand + aktiver Bereich ---------- */
  var nav = document.getElementById("nav");
  function onScroll() {
    nav.classList.toggle("scrolled", window.scrollY > 8);
    var cur = "";
    AREAS.forEach(function (a) { var s = document.getElementById(a.id); if (s && s.getBoundingClientRect().top < 160) cur = a.id; });
    [].forEach.call(document.querySelectorAll(".links a"), function (l) { l.classList.toggle("on", l.getAttribute("data-sec") === cur); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* ---------- Sprache & Hell/Dunkel ---------- */
  document.querySelector(".tog").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    L = b.getAttribute("data-lang");
    try { localStorage.setItem("ss-lang", L); } catch (er) {}
    render(); onScroll();
  });
  document.getElementById("theme").addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("ss-theme", next); } catch (er) {}
  });

  try {
    var sl = localStorage.getItem("ss-lang"), th = localStorage.getItem("ss-theme");
    if (sl === "de" || sl === "en") L = sl; else L = (navigator.language || "de").slice(0, 2) === "de" ? "de" : "en";
    if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
  } catch (er) {}
  render(); onScroll();
})();
</script>

<style>
:root {
  --bg: #fbfbfd; --bg2: #f2f2f6; --card: #fff; --ink: #1d1d1f; --ink2: #5e5e66; --ink3: #8a8a93;
  --line: rgba(0,0,0,.08); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(0,0,0,.14);
  --c: #ff6a3d; --c2: #ffb03d; --ok: #22b06b; --games: #ff6a3d; --tools: #2f7bff; --life: #22b06b; --org: #8b5cf6;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0b0d; --bg2: #1e1e22; --card: #161619; --ink: #f5f5f7; --ink2: #a8a8b0; --ink3: #77777f; --line: rgba(255,255,255,.1); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6); } }
:root[data-theme="dark"] { --bg: #0b0b0d; --bg2: #1e1e22; --card: #161619; --ink: #f5f5f7; --ink2: #a8a8b0; --ink3: #77777f; --line: rgba(255,255,255,.1); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }
.wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 600px) { .wrap { padding: 0 14px; } }

/* Kopfzeile */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 14px; height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 16px; letter-spacing: -.02em; color: var(--ink2); }
.logo svg { width: 24px; height: 24px; transition: transform .7s cubic-bezier(.34,1.56,.64,1); }
.logo:hover svg { transform: rotate(90deg); }
.nav h1 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.nav h1::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--c), var(--c2)); }
.sep { color: var(--ink3); }
.tog { display: flex; gap: 2px; background: var(--bg2); border-radius: 99px; padding: 3px; margin-left: auto; }
.tog button { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: var(--ink3); }
.tog button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.prog { display: flex; gap: 5px; align-items: center; }
.prog i { width: 22px; height: 5px; border-radius: 3px; background: var(--bg2); transition: background .3s; }
.prog i.done { background: var(--ok); } .prog i.cur { background: var(--c); }
.score { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 14px; }

/* Start */
.hero { padding: 54px 0 22px; }
.hero h2 { font-size: clamp(36px, 6vw, 60px); font-weight: 700; letter-spacing: -.045em; line-height: 1.02; }
.hero h2 span { background: linear-gradient(120deg, var(--c), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--ink2); font-size: 17px; max-width: 560px; margin-top: 12px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 28px 0 22px; }
.mode { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .2s; display: grid; gap: 8px; align-content: start; }
.mode:hover { transform: translateY(-3px); }
.mode[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), var(--shadow); }
.mode .em { font-size: 28px; line-height: 1; }
.mode b { font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
.mode small { font-size: 13px; color: var(--ink2); line-height: 1.4; }
.themes { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; font-weight: 550; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); transition: all .2s; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { color: var(--ink3); font-weight: 500; margin-left: 4px; }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; padding: 13px 24px; border-radius: 99px; background: var(--ink); color: var(--bg); transition: transform .2s, box-shadow .2s, opacity .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -10px rgba(0,0,0,.4); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.pri { background: linear-gradient(120deg, var(--c), var(--c2)); color: #fff; }
.btn.ghost { background: var(--bg2); color: var(--ink); }
.btn.sm { font-size: 14px; padding: 9px 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sec { margin: 30px 0; }
.sec h3 { font-size: 13px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; font-weight: 700; letter-spacing: .08em; padding: 10px 14px; border-radius: 12px; background: var(--bg2); display: inline-block; }
.inp { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); padding: 0 14px; font-size: 15px; outline: none; min-width: 0; }
.inp:focus { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.hs { display: grid; gap: 4px; }
.hs div { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 14px; }
.hs div:nth-child(odd) { background: var(--bg2); }
.hs div.me { outline: 2px solid var(--c); }
.hs b { font-variant-numeric: tabular-nums; }
.hs small { color: var(--ink3); display: block; font-size: 12px; }
.hs .rk { color: var(--ink3); font-weight: 600; }
.tabs { display: flex; gap: 4px; background: var(--bg2); padding: 3px; border-radius: 10px; margin-bottom: 10px; }
.tabs button { flex: 1; font-size: 12px; font-weight: 600; padding: 6px; border-radius: 8px; color: var(--ink3); }
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.muted { font-size: 13px; color: var(--ink3); }
footer { padding: 40px 0 30px; font-size: 12px; color: var(--ink3); }
footer a { text-decoration: underline; text-underline-offset: 2px; }

/* Spiel */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px 0; min-height: calc(100vh - 56px); align-content: start; }
.photo { position: relative; border-radius: 22px; overflow: hidden; background: #111; min-height: 320px; height: calc(100vh - 56px - 32px); max-height: 760px; display: grid; place-items: center; box-shadow: var(--shadow); touch-action: none; cursor: zoom-in; }
.photo img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; user-select: none; -webkit-user-drag: none; transition: opacity .35s; transform-origin: center; will-change: transform; }
.photo.z { cursor: grab; } .photo.z img { max-width: none; max-height: none; }
.photo .ld { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 14px; background: #111; transition: opacity .3s; }
.photo .ld i { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.photo .hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 5px 10px; border-radius: 99px; backdrop-filter: blur(6px); pointer-events: none; }
.panel { display: grid; gap: 14px; align-content: start; }
.card.tight { padding: 16px 18px; }
.lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 8px; }
.yr { font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; margin: 4px 0 10px; }
.yr.none { color: var(--ink3); font-size: 18px; font-weight: 500; letter-spacing: 0; padding: 11px 0; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--bg2), color-mix(in srgb, var(--c) 40%, var(--bg2))); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,.3), 0 0 0 1px var(--line); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--card); border: 0; box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; }
.yrs { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.ynum { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.ynum button { width: 36px; height: 32px; border-radius: 9px; background: var(--bg2); font-weight: 600; font-size: 13px; }
.gmap { position: relative; height: 300px; border-radius: 16px; overflow: hidden; background: var(--bg2); transition: height .35s cubic-bezier(.2,.8,.2,1); }
.gmap.big { height: 520px; }
.gmap .mx { position: absolute; top: 8px; right: 8px; z-index: 2; width: 32px; height: 32px; border-radius: 9px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; }
.gmap .mx svg { width: 15px; height: 15px; }
.gmap .ph { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; font-size: 12px; font-weight: 550; padding: 5px 11px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); white-space: nowrap; pointer-events: none; }
.pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); box-shadow: 0 0 0 2.5px #fff, 0 6px 14px -4px rgba(0,0,0,.5); position: relative; }
.pin::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
.pin.t { background: var(--ok); }
.cta { display: grid; gap: 8px; }
.cta .btn { width: 100%; }

/* Ergebnis */
.res { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 0; }
.rmap { height: calc(100vh - 56px - 32px); min-height: 360px; max-height: 760px; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
.pts { text-align: center; padding: 22px 18px 18px; }
.pts .big { font-size: 56px; font-weight: 700; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(120deg, var(--c), var(--c2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pts small { display: block; color: var(--ink3); font-size: 13px; margin-top: 6px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.split div { background: var(--bg2); border-radius: 14px; padding: 12px; }
.split b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.split span { font-size: 12px; color: var(--ink2); }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c), var(--c2)); border-radius: 3px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.info h2 { font-size: 20px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
.info p { font-size: 14px; color: var(--ink2); margin-top: 6px; }
.info .cred { font-size: 12px; color: var(--ink3); margin-top: 10px; line-height: 1.5; }
.info .cred a { text-decoration: underline; text-underline-offset: 2px; }
.thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 14px; margin-bottom: 12px; background: #111; }

/* Finale */
.final { padding: 40px 0; max-width: 720px; margin: 0 auto; }
.final .pts .big { font-size: clamp(64px, 12vw, 104px); }
.rounds { display: grid; gap: 6px; margin-top: 18px; }
.rounds div { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; background: var(--bg2); font-size: 14px; }
.rounds img { width: 56px; height: 42px; object-fit: cover; border-radius: 8px; background: #111; }
.rounds b { font-variant-numeric: tabular-nums; }
.rounds small { display: block; color: var(--ink3); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 550; padding: 10px 18px; border-radius: 99px; box-shadow: var(--shadow); animation: up .4s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { opacity: 0; transform: translate(-50%, 12px); } }
.fade { animation: fade .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fade { from { opacity: 0; transform: translateY(14px); } }
.maplibregl-ctrl-group { border-radius: 10px !important; box-shadow: var(--shadow) !important; }
.maplibregl-ctrl-attrib { font-size: 10px; }

@media (max-width: 900px) {
  .nav .sep, .nav .logo { display: none; }
  .nav .wrap { gap: 10px; }
  .prog i { width: 14px; }
  .game, .res { grid-template-columns: 1fr; }
  .photo { height: 46vh; min-height: 240px; }
  .rmap { height: 44vh; min-height: 280px; }
  .modes { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
  .gmap { height: 240px; } .gmap.big { height: 60vh; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

async function loadPhotos() {
  if (S.photos.length) return;
  const d = await (await fetch("data/photos.json", { cache: "no-cache" })).json();
  S.photos = d.photos.filter(p => p.file && p.year && p.lat != null);
  const ys = S.photos.map(p => p.year);
  S.yMin = Math.floor(Math.min(...ys) / 10) * 10; S.yMax = Math.ceil(Math.max(...ys) / 10) * 10;
}
function pickRounds() {
  let pool = S.mode === "theme" ? S.photos.filter(p => (p.cat || []).includes(S.theme)) : S.photos;
  const seen = new Set(store.get("hs-seen", []));
  let fresh = pool.filter(p => !seen.has(p.id));
  if (fresh.length < ROUNDS) { fresh = pool; store.set("hs-seen", []); }
  const out = [], used = new Set();
  // Mischen, dabei nach Möglichkeit verschiedene Orte und Jahrzehnte
  const arr = fresh.slice().sort(() => Math.random() - .5);
  for (const p of arr) {
    if (out.length >= ROUNDS) break;
    const k = p.place + "|" + Math.floor(p.year / 10);
    if (used.has(k) && arr.length > ROUNDS * 3) continue;
    used.add(k); out.push(p);
  }
  while (out.length < ROUNDS && arr.length > out.length) { const p = arr.find(x => !out.includes(x)); if (!p) break; out.push(p); }
  return out;
}

  view('<section class="final"><div class="card pts"><small style="font-size:14px;color:var(--ink2);margin:0 0 6px">' + t("final") + ' · ' + esc(modeName) + '</small><div class="big" id="cnt">0</div><small>' + t("of", { n: nf(maxTotal()) }) + '</small>' +
    '<div class="rounds">' + S.rounds.map((p, i) => '<div><img src="' + IMG(p.file, 200) + '" alt=""><span>' + esc(p.place) + '<small>' + p.year + ' · ' + (L === "de" ? "getippt" : "guessed") + ' ' + p.g.year + (p.g.km != null ? ' · ' + fmtKm(p.g.km) : "") + '</small></span><b>' + nf(p.g.pts) + '</b></div>').join("") + '</div>' +
    '<div class="row" style="justify-content:center;margin-top:20px"><button class="btn pri" id="sv">' + t("save") + '</button><button class="btn ghost" id="sh">' + t("share") + '</button><button class="btn ghost" id="ag">' + t("again") + '</button></div></div></section>');
  countUp($("cnt"), S.total);
  $("sv").onclick = async () => { $("sv").disabled = true; await hsSave({ code: user.code, name: user.name || null, score: S.total, mode: S.mode, theme: S.mode === "theme" ? S.theme : null, created_at: new Date().toISOString() }); $("sv").textContent = "✓ " + t("saved"); toast(t("saved")); };
  $("sh").onclick = async () => { const txt = t("shareTxt", { m: modeName, s: nf(S.total), n: nf(maxTotal()) }) + "\n" + location.href.split("?")[0]; if (navigator.share) { try { await navigator.share({ text: txt }); } catch (e) {} } else { navigator.clipboard?.writeText(txt); toast(t("copied")); } };
  $("ag").onclick = startGame;
}

/* ================= Sonstiges ================= */
let toastT; function toast(m) { let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); } el.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200); }
$("home").onclick = e => { e.preventDefault(); if (S.map) { S.map.remove(); S.map = null; } if (S.rmap) { S.rmap.remove(); S.rmap = null; } showHome(); };
document.querySelector(".tog").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (!b) return; L = b.dataset.lang; try { localStorage.setItem("ss-lang", L); } catch (er) {} document.querySelectorAll(".tog button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === L))); document.documentElement.lang = L; $("foot").innerHTML = t("foot"); if (!$("yr") && !$("nx")) showHome(); });
document.querySelectorAll(".tog button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === L)));
document.documentElement.lang = L; $("foot").innerHTML = t("foot");
loadPhotos().then(showHome).catch(() => { showHome(); toast(t("loadErr")); });
window.__hs = S;
</script>

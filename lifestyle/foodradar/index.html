<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodradar · Soy &amp; Soul</title>
<meta name="description" content="Die angesagtesten Restaurants, Cafés und Bars deiner Stadt auf einer Karte – mit Kategorien, Öffnungszeiten und den Videos, aus denen der Hype kommt.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg transform='translate(20 20)'%3E%3Cellipse rx='9.5' ry='6' transform='rotate(-45) translate(0 -8.5)' fill='%23ff6a3d'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(45) translate(0 -8.5)' fill='%232f7bff'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(135) translate(0 -8.5)' fill='%2334c27a'/%3E%3Cellipse rx='9.5' ry='6' transform='rotate(225) translate(0 -8.5)' fill='%238b5cf6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
:root {
  --bg: #fbfbfd; --bg2: #f2f2f6; --card: #ffffff; --ink: #1d1d1f; --ink2: #5e5e66; --ink3: #8a8a93;
  --line: rgba(0,0,0,.08); --glass: rgba(255,255,255,.78); --shadow: 0 2px 6px rgba(0,0,0,.06), 0 18px 40px -14px rgba(0,0,0,.22);
  --c: #22b06b; --hot: #ff4d2e; --hot2: #ff9a1f; --games: #ff6a3d; --tools: #2f7bff; --life: #22b06b; --org: #8b5cf6;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pw: 380px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b0b0d; --bg2: #232328; --card: #18181b; --ink: #f5f5f7; --ink2: #a8a8b0; --ink3: #77777f; --line: rgba(255,255,255,.1); --glass: rgba(24,24,27,.8); --shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 40px -14px rgba(0,0,0,.7); }
}
:root[data-theme="dark"] { --bg: #0b0b0d; --bg2: #232328; --card: #18181b; --ink: #f5f5f7; --ink2: #a8a8b0; --ink3: #77777f; --line: rgba(255,255,255,.1); --glass: rgba(24,24,27,.8); --shadow: 0 2px 6px rgba(0,0,0,.4), 0 18px 40px -14px rgba(0,0,0,.7); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }
#map { position: fixed; inset: 0; }
.glass { background: var(--glass); backdrop-filter: saturate(180%) blur(22px); -webkit-backdrop-filter: saturate(180%) blur(22px); border: 1px solid var(--line); box-shadow: var(--shadow); }

/* ---------- Seitenleiste ---------- */
.side { position: fixed; z-index: 5; top: 14px; left: 14px; bottom: 14px; width: var(--pw); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.top { padding: 14px 14px 10px; display: grid; gap: 12px; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand a.logo { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; letter-spacing: -.02em; color: var(--ink2); }
.brand a.logo svg { width: 22px; height: 22px; transition: transform .7s cubic-bezier(.34,1.56,.64,1); }
.brand a.logo:hover svg { transform: rotate(90deg); }
.brand .sep { color: var(--ink3); }
.brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.brand h1 i { font-style: normal; background: linear-gradient(120deg, var(--hot), var(--hot2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tog { display: flex; gap: 2px; background: var(--bg2); border-radius: 99px; padding: 3px; margin-left: auto; }
.tog button { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; color: var(--ink3); }
.tog button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.search { position: relative; }
.search input { width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 44px 0 42px; font-size: 16px; outline: none; transition: box-shadow .2s, border-color .2s; }
.search input:focus { border-color: color-mix(in srgb, var(--c) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.search > svg { position: absolute; left: 14px; top: 14px; width: 18px; height: 18px; color: var(--ink3); }
.search .loc { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--c); }
.search .loc:hover { background: var(--bg2); }
.search .loc svg { width: 18px; height: 18px; }
.sugg { position: absolute; left: 0; right: 0; top: 52px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; z-index: 3; }
.sugg button { display: block; width: 100%; text-align: left; padding: 11px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
.sugg button:last-child { border-bottom: 0; }
.sugg button:hover, .sugg button:focus { background: var(--bg2); outline: none; }
.sugg small { display: block; color: var(--ink3); font-size: 12px; margin-top: 1px; }
.cities { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.cities::-webkit-scrollbar { display: none; }
.cities button { flex: none; font-size: 13px; font-weight: 550; padding: 6px 12px; border-radius: 99px; background: var(--bg2); color: var(--ink2); transition: background .2s, color .2s; white-space: nowrap; }
.cities button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 2px 14px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 550; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; transition: all .2s; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--card)); border-color: color-mix(in srgb, var(--c) 55%, transparent); color: var(--ink); }
.chip.hot[aria-pressed="true"] { background: linear-gradient(120deg, var(--hot), var(--hot2)); border-color: transparent; color: #fff; }
.chip b { font-weight: 600; color: var(--ink3); font-size: 11px; }
.chip[aria-pressed="true"] b { color: inherit; opacity: .75; }

.list { flex: 1; overflow-y: auto; padding: 4px 10px 14px; scrollbar-width: thin; }
.lh { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 6px 8px; }
.lh h2 { font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
.lh span { font-size: 12px; color: var(--ink3); }
.item { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 9px 8px; border-radius: 16px; transition: background .2s; animation: up .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes up { from { opacity: 0; transform: translateY(12px); } }
.item:hover, .item.on { background: color-mix(in srgb, var(--card) 70%, var(--bg2)); }
.item .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 25px; background: linear-gradient(140deg, color-mix(in srgb, var(--hot2) 22%, var(--card)), color-mix(in srgb, var(--hot) 22%, var(--card))); position: relative; overflow: hidden; }
.item .ic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.item b { display: block; font-size: 15px; font-weight: 620; letter-spacing: -.015em; }
.item .tg { font-size: 12px; color: var(--ink3); margin-top: 1px; }
.item .why { font-size: 13px; color: var(--ink2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.item.miss { opacity: .62; }
.item.miss .ic { filter: grayscale(.6); }
.empty { padding: 26px 10px; text-align: center; color: var(--ink2); font-size: 14px; line-height: 1.5; }
.empty .big { font-size: 34px; display: block; margin-bottom: 8px; }
.foot { padding: 10px 16px 14px; font-size: 11px; color: var(--ink3); border-top: 1px solid var(--line); line-height: 1.5; }
.foot a { text-decoration: underline; text-underline-offset: 2px; }
.status { position: fixed; z-index: 6; left: calc(var(--pw) + 28px); top: 18px; font-size: 13px; font-weight: 550; padding: 8px 14px; border-radius: 99px; display: flex; align-items: center; gap: 8px; transition: opacity .3s; }
.status i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--c); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.zoomhint { position: fixed; z-index: 4; left: calc(50% + var(--pw) / 2); bottom: 30px; transform: translateX(-50%); font-size: 13px; font-weight: 550; padding: 9px 16px; border-radius: 99px; white-space: nowrap; }

/* ---------- Detailkarte ---------- */
.detail { position: fixed; z-index: 7; top: 14px; right: 14px; width: 380px; max-height: calc(100% - 28px); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; animation: din .45s cubic-bezier(.2,.8,.2,1); background: var(--card); }
@keyframes din { from { opacity: 0; transform: translateX(30px) scale(.98); } }
.hero { position: relative; height: 210px; flex: none; display: grid; place-items: center; overflow: hidden; }
.hero .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 72px; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero .x { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; backdrop-filter: blur(8px); z-index: 2; }
.hero .x svg { width: 14px; height: 14px; }
.hero .badge { position: absolute; left: 14px; bottom: 14px; z-index: 2; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: #fff; padding: 5px 11px; border-radius: 99px; background: linear-gradient(120deg, var(--hot), var(--hot2)); box-shadow: 0 6px 18px -6px var(--hot); }
.hero .cred { position: absolute; right: 10px; bottom: 8px; z-index: 2; font-size: 10px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.dbody { padding: 18px 20px 22px; overflow-y: auto; display: grid; gap: 16px; }
.dbody h2 { font-size: 26px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tags span { font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); padding: 3px 9px; border-radius: 99px; }
.why2 { font-size: 15px; line-height: 1.5; color: var(--ink); padding: 13px 15px; border-radius: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--hot2) 10%, var(--card)), color-mix(in srgb, var(--hot) 8%, var(--card))); }
.why2 b { display: block; font-size: 12px; font-weight: 700; color: var(--hot); margin-bottom: 3px; letter-spacing: .02em; text-transform: uppercase; }
.sec h3 { font-size: 12px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.open { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 650; }
.open i { width: 8px; height: 8px; border-radius: 50%; }
.open.y { color: #1f9d55; } .open.y i { background: #1f9d55; box-shadow: 0 0 0 4px rgba(31,157,85,.18); }
.open.n { color: #d9363e; } .open.n i { background: #d9363e; }
.hours { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.hours .today { color: var(--ink); font-weight: 650; }
.raw { font-size: 13px; color: var(--ink2); margin-top: 6px; }
.addr { font-size: 14px; color: var(--ink2); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; padding: 10px 15px; border-radius: 99px; background: var(--bg2); transition: transform .15s, background .2s; }
.btn:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--c) 14%, var(--bg2)); }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn svg { width: 15px; height: 15px; }
.srcs { display: grid; gap: 6px; }
.src { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 14px; border: 1px solid var(--line); font-size: 13px; transition: background .2s; }
.src:hover { background: var(--bg2); }
.src .pf { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; }
.src .pf.tiktok { background: #111; } .src .pf.youtube { background: #ff0033; } .src .pf.instagram { background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); } .src .pf.article { background: var(--ink2); }
.src span { line-height: 1.3; }
.src small { display: block; color: var(--ink3); font-size: 11px; }
.src svg { width: 14px; height: 14px; color: var(--ink3); }
.note { font-size: 11px; color: var(--ink3); line-height: 1.5; }

/* ---------- Hype-Marker ---------- */
.hm { cursor: pointer; }
.hm .pin { position: relative; display: flex; align-items: center; gap: 0; height: 38px; padding: 0 9px; border-radius: 99px; background: linear-gradient(130deg, var(--hot), var(--hot2)); color: #fff; font-weight: 650; font-size: 13px; box-shadow: 0 8px 22px -8px rgba(255,77,46,.9), 0 0 0 2.5px #fff; transition: transform .3s cubic-bezier(.34,1.56,.64,1), gap .3s; white-space: nowrap; }
.hm .pin .em { font-size: 19px; line-height: 1; }
.hm .pin .nm { max-width: 0; overflow: hidden; transition: max-width .4s cubic-bezier(.2,.8,.2,1), margin .3s; }
.hm::after { content: ""; position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: var(--hot); opacity: 0; animation: ring 2.6s ease-out infinite; animation-delay: var(--d, 0s); z-index: -1; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.8); opacity: .55; } 100% { transform: scale(2.4); opacity: 0; } }
.labels .hm .pin .nm, .hm:hover .pin .nm, .hm.on .pin .nm { max-width: 180px; margin-left: 6px; }
.hm:hover .pin, .hm.on .pin { transform: scale(1.12); }
.hm.on { z-index: 3; }
.hm.dim { opacity: .18; pointer-events: none; }
.hm.pop .pin { animation: pop .55s cubic-bezier(.34,1.56,.64,1) both; animation-delay: var(--d, 0s); }
@keyframes pop { from { transform: scale(0); opacity: 0; } }

.cm { cursor: pointer; display: grid; place-items: center; min-width: 54px; height: 54px; padding: 0 12px; border-radius: 99px; background: linear-gradient(130deg, var(--hot), var(--hot2)); color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 10px 26px -8px rgba(255,77,46,.8), 0 0 0 3px #fff; transition: transform .3s cubic-bezier(.34,1.56,.64,1); line-height: 1.1; text-align: center; }
.cm small { display: block; font-size: 11px; font-weight: 600; opacity: .9; }
.cm:hover { transform: scale(1.08); }

.maplibregl-ctrl-group { border-radius: 14px !important; overflow: hidden; box-shadow: var(--shadow) !important; }
.maplibregl-ctrl-attrib { font-size: 10px; }

/* ---------- Mobil ---------- */
@media (max-width: 760px) {
  :root { --pw: 0px; }
  .side { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 46vh; border-radius: 24px 24px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
  .side.min { height: 170px; }
  .grab { display: block !important; width: 40px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: .45; margin: 8px auto -4px; }
  .status { left: 50%; transform: translateX(-50%); top: 12px; }
  .zoomhint { left: 50%; bottom: auto; top: 56px; }
  .detail { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 82vh; border-radius: 24px 24px 0 0; animation-name: dup; }
  @keyframes dup { from { transform: translateY(40px); opacity: 0; } }
  .hero { height: 170px; }
  .maplibregl-ctrl-top-right { top: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Karte"></div>

<aside class="side glass" id="side">
  <span class="grab" hidden id="grab"></span>
  <div class="top">
    <div class="brand">
      <a class="logo" href="../../#lifestyle" aria-label="Soy &amp; Soul">
        <svg viewBox="0 0 40 40" aria-hidden="true"><g transform="translate(20 20)" opacity=".9">
          <ellipse rx="9.5" ry="6" transform="rotate(-45) translate(0 -8.5)" fill="var(--games)"/><ellipse rx="9.5" ry="6" transform="rotate(45) translate(0 -8.5)" fill="var(--tools)"/>
          <ellipse rx="9.5" ry="6" transform="rotate(135) translate(0 -8.5)" fill="var(--life)"/><ellipse rx="9.5" ry="6" transform="rotate(225) translate(0 -8.5)" fill="var(--org)"/></g></svg>
      </a>
      <span class="sep">/</span>
      <h1>Food<i>radar</i></h1>
      <div class="tog" role="group" aria-label="Sprache"><button data-lang="de" aria-pressed="true">DE</button><button data-lang="en" aria-pressed="false">EN</button></div>
    </div>
    <form class="search" id="sform" autocomplete="off">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
      <input id="q" type="search" enterkeyhint="search">
      <button type="button" class="loc" id="locate" aria-label="Standort"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="3.2"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/><circle cx="10" cy="10" r="6.5"/></svg></button>
      <div class="sugg" id="sugg" hidden></div>
    </form>
    <div class="cities" id="cities"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</aside>

<div class="status glass" id="status" hidden><i></i><span id="statusT"></span></div>
<div class="zoomhint glass" id="zoomhint" hidden></div>
<article class="detail glass" id="detail" hidden></article>

<script type="module">
import { Map as MLMap, Marker, NavigationControl, GeolocateControl, AttributionControl } from "./lib/maplibre-gl.mjs";

/* ================= Einstellungen ================= */
const STYLE = { light: "https://tiles.openfreemap.org/styles/positron", dark: "https://tiles.openfreemap.org/styles/dark" };
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter"];
const NOMINATIM = "https://nominatim.openstreetmap.org/search";
const MIN_ZOOM_SPOTS = 14.3;      // ab hier werden alle Lokale im Ausschnitt geladen
const FOOD = "restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|food_court|marketplace|bakery|pastry|confectionery|deli";

/* ================= Texte ================= */
const T = {
  search: { de: "Stadt oder Ort suchen", en: "Search a city or place" },
  hot: { de: "Angesagt", en: "Trending" }, all: { de: "Alle", en: "All" },
  hotIn: { de: "Angesagt in {c}", en: "Trending in {c}" },
  spots: { de: "{n} Hype-Spots", en: "{n} hype spots" },
  pick: { de: "Wähle eine Stadt", en: "Pick a city" },
  pickP: { de: "Für diese Städte gibt es eine recherchierte Hype-Liste. Überall sonst siehst du beim Hineinzoomen alle Restaurants, Cafés und Bars.", en: "These cities have a researched hype list. Everywhere else, zoom in to see all restaurants, cafés and bars." },
  noHype: { de: "Für diese Gegend gibt es noch keine Hype-Liste. Zoom hinein, um alle Lokale mit Kategorien und Öffnungszeiten zu sehen.", en: "There's no hype list for this area yet. Zoom in to see every place with categories and opening hours." },
  nearby: { de: "In der Nähe", en: "Nearby" },
  nearbyN: { de: "{n} Lokale im Ausschnitt", en: "{n} places in view" },
  zoomIn: { de: "Hineinzoomen, um alle Lokale zu sehen", en: "Zoom in to see every place" },
  loadingHype: { de: "Hype-Spots werden gesucht …", en: "Finding hype spots …" },
  loadingSpots: { de: "Lokale werden geladen …", en: "Loading places …" },
  errSpots: { de: "Lokale konnten gerade nicht geladen werden", en: "Places couldn't be loaded right now" },
  notFound: { de: "Nicht auf der Karte gefunden", en: "Not found on the map" },
  nothing: { de: "Nichts gefunden", en: "Nothing found" },
  whyH: { de: "Darum ist es angesagt", en: "Why it's trending" },
  hours: { de: "Öffnungszeiten", en: "Opening hours" },
  openNow: { de: "Jetzt geöffnet", en: "Open now" }, closedNow: { de: "Jetzt geschlossen", en: "Closed now" },
  until: { de: " · bis {t}", en: " · until {t}" }, opens: { de: " · öffnet {d} {t}", en: " · opens {d} {t}" },
  closed: { de: "geschlossen", en: "closed" }, noHours: { de: "Keine Öffnungszeiten hinterlegt", en: "No opening hours listed" },

async function overpass(q, signal) {

}

let spotCtl = null, spotKey = "";
const spotCache = new Map();
async function loadSpots() {
  const z = map.getZoom();
  $("zoomhint").hidden = !(S.city && z < MIN_ZOOM_SPOTS && z >= 11) || S.onlyHype;
  $("zoomhint").textContent = t("zoomIn");
  if (z < MIN_ZOOM_SPOTS || S.onlyHype) {

    return;

  const b = map.getBounds(), r = v => Math.round(v * 200) / 200;

  const key = [s, w, n, e].join(",");

  if (spotCtl) spotCtl.abort(); spotCtl = new AbortController();
  status(t("loadingSpots"));
  try {
    const els = await overpass('[out:json][timeout:25];nwr[~"^(amenity|shop)$"~"^(restaurant|cafe|bar|pub|fast_food|ice_cream|biergarten|bakery|pastry)$"]["name"](' + key + ');out center tags 700;', spotCtl.signal);

}

  const a = tg.amenity || tg.shop;
  if (a === "cafe") set.add("cafe");
  if (a === "bar" || a === "pub" || a === "biergarten") set.add("bar");
  if (a === "bakery" || a === "pastry") set.add("baeckerei");
  if (a === "ice_cream") set.add("eis");

function renderChips() {

  if (!S.onlyHype) S.spots.forEach(x => x.tags.forEach(k => count[k] = (count[k] || 0) + 1));
  const keys = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 18);
  if (S.filter && !keys.includes(S.filter)) keys.unshift(S.filter);
  let h = '<button class="chip hot" data-f="hot" aria-pressed="' + S.onlyHype + '">🔥 ' + t("hot") + '</button>';
  h += '<button class="chip" data-f="" aria-pressed="' + !S.filter + '">' + t("all") + '</button>';

  if (!S.city) {
    const near = S.spots.length && map.getZoom() >= MIN_ZOOM_SPOTS ? spotsHTML() : "";
    box.innerHTML = (S.hype && S.hype.cities.length && map.getZoom() < 9.5
      ? '<div class="empty"><span class="big">🗺️</span><b>' + t("pick") + '</b><br>' + t("pickP") + '</div>'
      : '<div class="empty"><span class="big">🍽️</span>' + t("noHype") + '</div>') + near;
    return;
  }
  const res = resArg || S.cityRes[S.city.id] || {};
  const list = (listArg || S.hype.places.filter(p => p.city === S.city.id)).filter(p => !S.filter || p.tags.includes(S.filter));
  const found = list.filter(p => res[p.name]), miss = list.filter(p => !res[p.name]);
  let h = '<div class="lh"><h2>' + t("hotIn", { c: esc(S.city.name[L]) }) + '</h2><span>' + t("spots", { n: list.length }) + '</span></div>';
  if (!list.length) h += '<div class="empty">' + t("nothing") + '</div>';
  h += found.map((p, i) => item(p, i, false)).join("");
  if (miss.length && !loading) h += '<div class="lh"><span>' + t("notFound") + '</span></div>' + miss.map((p, i) => item(p, i, true)).join("");
  else if (loading) h += miss.map((p, i) => item(p, i, false)).join("");
  h += spotsHTML();
  box.innerHTML = h;
}
function item(p, i, miss) {
  const r = p._r, img = r && imgOf(r.tags);
  return '<button class="item' + (miss ? " miss" : "") + (S.sel && S.sel.hype === p ? " on" : "") + '" data-h="' + esc(p.name) + '" style="--d:' + Math.min(i * .035, .5) + 's">' +
    '<span class="ic">' + tagEm(p.tags[0]) + (img ? '<img loading="lazy" alt="" src="' + esc(img.thumb) + '" onerror="this.remove()">' : "") + '</span>' +
    '<span><b>' + esc(p.name) + '</b><span class="tg">' + p.tags.map(k => "#" + esc(tagName(k))).join(" ") + '</span><span class="why">' + esc(p.why[L]) + '</span></span></button>';
}
function spotsHTML() {
  if (S.onlyHype || map.getZoom() < MIN_ZOOM_SPOTS || !S.spots.length) return "";
  const c = map.getCenter();
  const list = S.spots.filter(x => !S.filter || x.tags.includes(S.filter))
    .map(x => [x, (x.lat - c.lat) ** 2 + ((x.lon - c.lng) * Math.cos(c.lat * Math.PI / 180)) ** 2]).sort((a, b) => a[1] - b[1]).slice(0, 40).map(a => a[0]);
  if (!list.length) return "";
  return '<div class="lh"><h2>' + t("nearby") + '</h2><span>' + t("nearbyN", { n: S.spots.length }) + '</span></div>' +
    list.map((x, i) => '<button class="item" data-s="' + x.id + '" style="--d:' + Math.min(i * .02, .4) + 's"><span class="ic" style="background:var(--bg2)">' + tagEm(x.tags[0]) + '</span><span><b>' + esc(x.name) + '</b><span class="tg">' + x.tags.map(k => "#" + esc(tagName(k))).join(" ") + '</span></span></button>').join("");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  if (b.dataset.h != null) {
    const p = S.hype.places.find(p => p.city === S.city.id && p.name === b.dataset.h);
    if (p && p._r) { openDetail(hypeObj(p)); } else if (p) openDetail({ id: "h-" + p.name, hype: p, name: p.name, tags: p.tags, osm: {}, addr: p.addr });
  } else if (b.dataset.s) { const x = S.spots.find(x => x.id === b.dataset.s); if (x) openDetail(x); }
});
map.on("moveend", () => { if (S.city || S.spots.length) renderListSoft(); });
let softT; function renderListSoft() { clearTimeout(softT); softT = setTimeout(() => { if (!S.city) renderList(); else if (!S.onlyHype) { const top = $("list").scrollTop; renderList(); $("list").scrollTop = top; } }, 250); }

/* ================= Detail ================= */
function imgOf(tg) {
  if (!tg) return null;
  let f = tg.wikimedia_commons || "";
  if (!f && /commons\.wikimedia\.org\/wiki\/(File:[^?#]+)/.test(tg.image || "")) f = decodeURIComponent(RegExp.$1);
  if (f.startsWith("File:")) { const n = encodeURIComponent(f.slice(5).replace(/ /g, "_")); return { src: "https://commons.wikimedia.org/wiki/Special:FilePath/" + n + "?width=900", thumb: "https://commons.wikimedia.org/wiki/Special:FilePath/" + n + "?width=160", cred: "Wikimedia Commons" }; }
  if (/^https:\/\/upload\.wikimedia\.org\//.test(tg.image || "")) return { src: tg.image, thumb: tg.image, cred: "Wikimedia Commons" };
  return null;
}
async function openDetail(x) {
  S.sel = x;
  S.markers.forEach(m => m.el.classList.toggle("on", !!x.hype && m.p === x.hype));
  if (x.lat != null) {
    const off = innerWidth <= 760 ? [0, -innerHeight * .22] : [0, 0];
    map.easeTo({ center: [x.lon, x.lat], zoom: Math.max(map.getZoom(), 15.2), offset: off, duration: 900 });
  }
  drawDetail(x);
  // Fehlen Details (z. B. Treffer über Nominatim), aus OSM nachladen
  if (x.osmId && !x.osm.opening_hours && !x._full) {
    x._full = true;
    try {
      const type = { n: "node", w: "way", r: "relation" }[x.osmId[0]], id = x.osmId.slice(1);
      const els = await overpass("[out:json][timeout:15];" + type + "(" + id + ");out tags;");
      if (els[0] && els[0].tags) { x.osm = Object.assign({}, els[0].tags, x.osm); if (S.sel === x) drawDetail(x); }
    } catch (e) {}
  }
  renderListSoft();
}
function drawDetail(x) {
  const tg = x.osm || {}, h = x.hype, img = imgOf(tg);
  const name = h ? h.name : x.name;
  const street = [tg["addr:street"], tg["addr:housenumber"]].filter(Boolean).join(" ");
  const addr = street ? street + (tg["addr:city"] ? ", " + (tg["addr:postcode"] ? tg["addr:postcode"] + " " : "") + tg["addr:city"] : "") : (x.addr || "");
  const site = tg.website || tg["contact:website"] || "";
  const insta = tg["contact:instagram"] || "";
  const instaUrl = insta ? (/^https?:/.test(insta) ? insta : "https://www.instagram.com/" + insta.replace(/^@/, "") + "/") : "";
  const cityN = S.city ? S.city.name.de : "";
  const gq = encodeURIComponent(name + " " + (addr || cityN));
  const gmaps = "https://www.google.com/maps/search/?api=1&query=" + gq;
  const route = x.lat != null ? "https://www.google.com/maps/dir/?api=1&destination=" + x.lat + "," + x.lon : gmaps;
  const oh = tg.opening_hours ? hoursHTML(tg.opening_hours) : '<div class="raw">' + t("noHours") + '</div>';
  const grad = "linear-gradient(140deg, color-mix(in srgb, var(--hot2) 35%, var(--card)), color-mix(in srgb, var(--hot) 30%, var(--card)))";
  const gradN = "linear-gradient(140deg, color-mix(in srgb, var(--c) 22%, var(--card)), var(--bg2))";
  const icon = { tiktok: "♪", youtube: "▶", instagram: "◎", article: "Aa" };
  $("detail").innerHTML =
    '<div class="hero" style="background:' + (h ? grad : gradN) + '"><div class="ph">' + tagEm(x.tags[0]) + '</div>' +
    (img ? '<img alt="" src="' + esc(img.src) + '" onerror="this.nextElementSibling&&this.nextElementSibling.remove();this.remove()"><span class="cred">' + t("photo") + ': ' + img.cred + '</span>' : "") +
    (h ? '<span class="badge">' + t("hypeBadge") + '</span>' : "") +
    '<button class="x" id="dx" aria-label="Schließen"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>' +
    '<div class="dbody"><div><h2>' + esc(name) + '</h2><div class="tags">' + x.tags.map(k => '<span>' + tagEm(k) + ' #' + esc(tagName(k)) + '</span>').join("") + '</div></div>' +
    (h ? '<div class="why2"><b>' + t("whyH") + '</b>' + esc(h.why[L]) + '</div>' : "") +
    '<div class="sec"><h3>' + t("hours") + '</h3>' + oh + '</div>' +
    (addr ? '<div class="addr">📍 ' + esc(addr) + '</div>' : "") +
    '<div class="acts"><a class="btn pri" target="_blank" rel="noopener" href="' + esc(route) + '">' + t("route") + '</a>' +
    '<a class="btn" target="_blank" rel="noopener" href="' + esc(gmaps) + '">' + t("photos") + '</a>' +
    (site ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(site) + '">' + t("web") + '</a>' : "") +
    (instaUrl ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(instaUrl) + '">Instagram</a>' : "") + '</div>' +
    (h && h.src && h.src.length ? '<div class="sec"><h3>' + t("srcH") + '</h3><div class="srcs">' + h.src.map(s =>
      '<a class="src" target="_blank" rel="noopener" href="' + esc(s.u) + '"><span class="pf ' + s.t + '">' + icon[s.t] + '</span><span>' + esc(s.l) + '<small>' + (typeof T.typ[s.t] === "string" ? T.typ[s.t] : T.typ[s.t][L]) + '</small></span><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 2h7v7M12 2 4 10"/></svg></a>').join("") + '</div></div>' : "") +
    '<div class="note">' + (tg.opening_hours ? t("checkNote") + " " : "") + '© OpenStreetMap</div></div>';
  $("detail").hidden = false;
  $("dx").onclick = closeDetail;
}
function closeDetail() { $("detail").hidden = true; S.sel = null; S.markers.forEach(m => m.el.classList.remove("on")); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
map.on("click", e => { if (!map.queryRenderedFeatures(e.point, { layers: map.getLayer("spots") ? ["spots"] : [] }).length) closeDetail(); });

/* ================= Öffnungszeiten (häufige OSM-Formate) ================= */
const DN = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
function parseOH(s) {
  s = s.trim();
  if (s === "24/7") return Array.from({ length: 7 }, () => [[0, 1440]]);
  const week = Array.from({ length: 7 }, () => null);
  for (let rule of s.split(";")) {
    rule = rule.trim(); if (!rule) continue;
    if (/^PH\b|^SH\b/.test(rule)) continue;
    const m = rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)+)?(?:,?\s*PH\s*)?\s*(.*)$/);
    if (!m) return null;
    let days = [];
    if (m[1]) for (const part of m[1].split(",").map(x => x.trim()).filter(Boolean)) {
      const [a, b] = part.split("-").map(d => DN.indexOf(d));
      if (a < 0) return null;
      if (b == null || isNaN(b)) days.push(a); else { for (let d = a; ; d = (d + 1) % 7) { days.push(d); if (d === b) break; } }
    } else days = [0, 1, 2, 3, 4, 5, 6];
    const rest = m[2].trim();
    if (/^(off|closed)$/i.test(rest)) { days.forEach(d => week[d] = []); continue; }
    const spans = [];
    for (const tr of rest.split(",").map(x => x.trim()).filter(Boolean)) {
      const mm = tr.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/); if (!mm) return null;
      const a = +mm[1] * 60 + +mm[2]; let b = +mm[3] * 60 + +mm[4]; if (b <= a) b += 1440;
      spans.push([a, b]);
    }
    if (!spans.length) return null;
    days.forEach(d => week[d] = spans);
  }
  return week.some(x => x) ? week.map(x => x || []) : null;
}
function hhmm(m) { m %= 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function hoursHTML(raw) {
  const w = parseOH(raw);
  if (!w) return '<div class="raw">' + esc(raw) + '</div>';
  const now = new Date(), wd = (now.getDay() + 6) % 7, mins = now.getHours() * 60 + now.getMinutes();
  let open = false, until = null;
  for (const [a, b] of w[wd]) if (mins >= a && mins < b) { open = true; until = b; }
  const prev = (wd + 6) % 7;
  for (const [a, b] of w[prev]) if (b > 1440 && mins < b - 1440) { open = true; until = b - 1440; }
  let line;
  if (open) line = '<span class="open y"><i></i>' + t("openNow") + t("until", { t: hhmm(until) }) + '</span>';
  else {
    let nx = null;
    for (let k = 0; k < 7 && !nx; k++) { const d = (wd + k) % 7; for (const [a] of w[d]) if (k > 0 || a > mins) { nx = [k, a]; break; } }
    const dl = nx ? (nx[0] === 0 ? t("today") : nx[0] === 1 ? t("tomorrow") : T.days[L][(wd + nx[0]) % 7]) : "";
    line = '<span class="open n"><i></i>' + t("closedNow") + (nx ? t("opens", { d: dl, t: hhmm(nx[1]) }) : "") + '</span>';
  }
  const rows = w.map((sp, d) => '<span class="' + (d === wd ? "today" : "") + '">' + T.days[L][d] + '</span><span class="' + (d === wd ? "today" : "") + '">' + (sp.length ? sp.map(([a, b]) => hhmm(a) + "–" + hhmm(b)).join(", ") : t("closed")) + '</span>').join("");
  return line + '<div class="hours">' + rows + '</div>';
}
window.__oh = hoursHTML;

/* ================= Suche ================= */
let sTimer, sCtl;
$("q").addEventListener("input", () => { clearTimeout(sTimer); const v = $("q").value.trim(); if (v.length < 3) { $("sugg").hidden = true; return; } sTimer = setTimeout(() => search(v, false), 650); });
$("sform").addEventListener("submit", e => { e.preventDefault(); clearTimeout(sTimer); const v = $("q").value.trim(); if (v) search(v, true); });
async function search(v, go) {
  // Erst die Hype-Städte prüfen, das spart Anfragen
  const hc = S.hype && S.hype.cities.find(c => norm(c.name.de) === norm(v) || norm(c.name.en) === norm(v));
  if (hc && go) { $("sugg").hidden = true; $("q").blur(); goCity(hc); return; }
  if (sCtl) sCtl.abort(); sCtl = new AbortController();
  try {
    const u = NOMINATIM + "?format=jsonv2&limit=6&addressdetails=0&accept-language=" + L + "&q=" + encodeURIComponent(v);
    const j = await (await fetch(u, { signal: sCtl.signal })).json();
    if (go && j[0]) { pickResult(j[0]); return; }
    if (document.activeElement !== $("q")) return;
    $("sugg").innerHTML = j.length ? j.map((r, i) => '<button type="button" data-i="' + i + '">' + esc(r.name || r.display_name.split(",")[0]) + '<small>' + esc(r.display_name) + '</small></button>').join("") : '<button type="button" disabled>' + t("nothing") + '</button>';
    $("sugg").hidden = false;
    $("sugg").onclick = e => { const b = e.target.closest("[data-i]"); if (b) pickResult(j[+b.dataset.i]); };
  } catch (e) {}
}
function pickResult(r) {
  $("sugg").hidden = true; $("q").blur(); closeDetail();
  const bb = r.boundingbox.map(Number); // [S, N, W, E]
  const small = (bb[1] - bb[0]) < .01;
  if (small) map.flyTo({ center: [+r.lon, +r.lat], zoom: 16.5, padding: pad(), duration: 1600 });
  else map.fitBounds([[bb[2], bb[0]], [bb[3], bb[1]]], { padding: pad(), maxZoom: 13, duration: 1600 });
}
document.addEventListener("click", e => { if (!e.target.closest("#sform")) $("sugg").hidden = true; });

/* ================= Statuszeile ================= */
let stT; function status(msg, ms) { clearTimeout(stT); if (!msg) { $("status").hidden = true; return; } $("statusT").textContent = msg; $("status").hidden = false; if (ms) stT = setTimeout(() => $("status").hidden = true, ms); }

/* ================= Sprache ================= */
function lang() {
  document.documentElement.lang = L;
  $("q").placeholder = t("search");
  document.querySelectorAll(".tog button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === L)));
  if (S.hype) { renderCities(); renderFoot(); renderChips(); renderList(); cityBubbles(); }
  if (S.sel) drawDetail(S.sel);
}
document.querySelector(".tog").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (!b) return; L = b.dataset.lang; try { localStorage.setItem("ss-lang", L); } catch (er) {} lang(); });

/* Mobil: Liste per Tipp auf den Griff ein- und ausklappen */
$("grab").onclick = () => $("side").classList.toggle("min");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.getAttribute("data-theme")) map.setStyle(dark() ? STYLE.dark : STYLE.light); });
map.on("styledata", () => { if (map.isStyleLoaded() && !map.getSource("spots")) addSpotLayers(); });
lang();
</script>
